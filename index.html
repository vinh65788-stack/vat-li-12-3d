          <span class="plot-sub">${cfg.plotTitle || 'Khảo sát quan hệ'}</span>
        </div>
        <canvas class="sim-plot-canvas"></canvas>
      </div>
      <div class="sim-presets-box glass">
        <div class="sidebar-label">KỊCH BẢN THỰC NGHIỆM:</div>
        <div class="sim-preset-chips"></div>
      </div>
      <div class="sim-controls-box glass">
        <div class="sidebar-label">BẢNG ĐIỀU KHIỂN & THÔNG SỐ:</div>
        <div class="sim-controls-list"></div>
      </div>
    `;
    leftMount.appendChild(leftPanel);

    rightPanel = document.createElement('div');
    rightPanel.className = 'ql-sim-right-panel';
    rightPanel.innerHTML = `
      <div class="sim-readouts-box glass">
        <div class="sidebar-label">THÔNG SỐ VẬT LÍ TRỰC TIẾP:</div>
        <div class="sim-readouts-grid"></div>
      </div>
      <div class="sim-challenge-box glass">
        <div class="challenge-header">
          <span class="ch-badge">&#9733; THỬ THÁCH VẬT LÍ</span>
          <span class="ch-state">DỰ ĐOÁN &rarr; XÁC NHẬN</span>
        </div>
        <div class="sim-challenge-content"></div>
      </div>
    `;
    rightMount.appendChild(rightPanel);
  } else {
    shellEl = document.createElement('div');
    shellEl.className = 'ql-sim-shell';
    shellEl.dataset.secId = cfg.secId || '';
    shellEl.innerHTML = `
      <div class="sim-viewport-col">
        <div class="sim-3d-wrap">
          <div class="sim-3d-mount"></div>
          <div class="sim-brackets">
            <div class="b-tl"></div><div class="b-tr"></div>
            <div class="b-bl"></div><div class="b-br"></div>
          </div>
          <div class="sim-view-hint">kéo để xoay &bull; chụm để thu phóng</div>
          <div class="sim-view-tools">
            <button class="btn-tool" data-act="reset" title="Đặt lại góc nhìn">↺</button>
            <button class="btn-tool" data-act="zoomIn" title="Phóng to">+</button>
            <button class="btn-tool" data-act="zoomOut" title="Thu nhỏ">−</button>
            <button class="btn-tool" data-act="pause" title="Tạm dừng/Tiếp tục">⏸</button>
            <button class="btn-tool btn-tool-focus" data-act="focus" title="Chế độ tập trung phòng thí nghiệm 3D">⛶</button>
          </div>
        </div>
        <div class="sim-plot-card glass">
          <div class="sim-plot-head">
            <span class="plot-tag">ĐỒ THỊ THỰC NGHIỆM</span>
            <span class="plot-sub">${cfg.plotTitle || 'Khảo sát quan hệ'}</span>
          </div>
          <canvas class="sim-plot-canvas"></canvas>
        </div>
      </div>
      <div class="sim-sidebar-col">
        <div class="sim-presets-box glass">
          <div class="sidebar-label">KỊCH BẢN THỰC NGHIỆM:</div>
          <div class="sim-preset-chips"></div>
        </div>
        <div class="sim-controls-box glass">
          <div class="sidebar-label">BẢNG ĐIỀU KHIỂN & THÔNG SỐ:</div>
          <div class="sim-controls-list"></div>
        </div>
        <div class="sim-readouts-box glass">
          <div class="sidebar-label">THÔNG SỐ VẬT LÍ TRỰC TIẾP:</div>
          <div class="sim-readouts-grid"></div>
        </div>
        <div class="sim-challenge-box glass">
          <div class="challenge-header">
            <span class="ch-badge">&#9733; THỬ THÁCH VẬT LÍ</span>
            <span class="ch-state">DỰ ĐOÁN &rarr; XÁC NHẬN</span>
          </div>
          <div class="sim-challenge-content"></div>
        </div>
      </div>
    `;
    if (container && container.appendChild) container.appendChild(shellEl);
  }

  const findEl = (sel) => {
    if (leftPanel || rightPanel) {
      return (leftPanel && leftPanel.querySelector(sel)) || (rightPanel && rightPanel.querySelector(sel)) || null;
    }
    return shellEl ? shellEl.querySelector(sel) : null;
  };

  const findAll = (sel) => {
    if (leftPanel || rightPanel) {
      const a = leftPanel ? Array.from(leftPanel.querySelectorAll(sel)) : [];
      const b = rightPanel ? Array.from(rightPanel.querySelectorAll(sel)) : [];
      return [...a, ...b];
    }
    return shellEl ? Array.from(shellEl.querySelectorAll(sel)) : [];
  };

  const mount3d = findEl('.sim-3d-mount');
  const plotCanvas = findEl('.sim-plot-canvas');
  const presetsContainer = findEl('.sim-preset-chips');
  const controlsContainer = findEl('.sim-controls-list');
  const readoutsContainer = findEl('.sim-readouts-grid');
  const challengeContainer = findEl('.sim-challenge-content');

  // Mark checkpoint (b) on interaction
  function onUserInteract() {
    if (cfg.secId && window.ProgressEngine) {
      ProgressEngine.markInteracted(cfg.secId);
    }
  }

  // Init Geo3D view
  const g3d = Geo3D.createView(mount3d, {
    yaw: cfg.yaw !== undefined ? cfg.yaw : 0.6,
    pitch: cfg.pitch !== undefined ? cfg.pitch : 0.4,
    distance: cfg.distance !== undefined ? cfg.distance : 9.0,
    target: cfg.target,
    onInteract: onUserInteract
  });

  // Init MiniPlot
  const plot = MiniPlot.create(plotCanvas, {
    accentColor: topicColor,
    xLabel: cfg.plotXLabel || 'x',
    yLabel: cfg.plotYLabel || 'y',
    ...cfg.plotConfig
  });

  // Tools listeners
  let isSimPaused = false;
  findAll('.btn-tool').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const act = btn.dataset.act;
      if (act === 'reset') g3d.resetCamera();
      else if (act === 'zoomIn') g3d.zoomBy(-1.2);
      else if (act === 'zoomOut') g3d.zoomBy(1.2);
      else if (act === 'pause') {
        isSimPaused = !isSimPaused;
        btn.textContent = isSimPaused ? '▶' : '⏸';
        g3d.isPaused = isSimPaused;
        if (cfg.onTogglePause) cfg.onTogglePause(isSimPaused);
      } else if (act === 'focus') {
        const grid = document.querySelector('.ql-detail-grid');
        if (grid) {
          const isFocused = grid.classList.toggle('focus-active');
          btn.textContent = isFocused ? '✕' : '⛶';
          btn.title = isFocused ? 'Thu nhỏ lại giao diện kép' : 'Chế độ tập trung phòng thí nghiệm 3D';
          setTimeout(() => {
            if (g3d && g3d.resize) g3d.resize();
            if (plot && plot.render) plot.render();
          }, 460);
          if (window.AudioEngine) AudioEngine.playClick();
        }
      }
      onUserInteract();
    });
  });

  // Populate Presets
  if (cfg.presets && cfg.presets.length) {
    cfg.presets.forEach((pr, i) => {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'preset-chip';
      chip.textContent = pr.label;
      chip.addEventListener('click', () => {
        if (cfg.onApplyPreset) cfg.onApplyPreset(pr, i);
        if (window.AudioEngine) AudioEngine.playTick();
        onUserInteract();
      });
      presetsContainer.appendChild(chip);
    });
  }

  // Populate Readouts
  const readoutElements = {};
  if (cfg.readouts) {
    for (const [key, item] of Object.entries(cfg.readouts)) {
      const rRow = document.createElement('div');
      rRow.className = 'readout-item';
      rRow.innerHTML = `
        <span class="r-label">${item.label}:</span>
        <span class="r-val" id="r_${key}">--</span>
      `;
      readoutsContainer.appendChild(rRow);
      readoutElements[key] = rRow.querySelector('.r-val');
    }
  }

  function updateReadout(key, valStr) {
    const el = readoutElements[key];
    if (el && el.textContent !== valStr) {
      el.textContent = valStr;
      el.classList.add('flash');
      setTimeout(() => el.classList.remove('flash'), 180);
    }
  }

  // Populate Challenge
  if (cfg.challenges && cfg.challenges.length) {
    let currentChIdx = 0;
    function renderChallenge() {
      const ch = cfg.challenges[currentChIdx];
      challengeContainer.innerHTML = `
        <div class="ch-q">${ch.q}</div>
        <div class="ch-choices">
          ${ch.choices.map((c, idx) => `
            <label class="ch-choice-label">
              <input type="radio" name="ch_choice_${cfg.secId}" value="${idx}">
              <span>${c}</span>
            </label>
          `).join('')}
        </div>
        <button class="btn ch-confirm-btn" type="button">Xác nhận dự đoán & Khảo sát</button>
        <div class="ch-result-box" style="display:none;"></div>
      `;

      const confirmBtn = challengeContainer.querySelector('.ch-confirm-btn');
      const resBox = challengeContainer.querySelector('.ch-result-box');

      confirmBtn.addEventListener('click', () => {
        const selected = challengeContainer.querySelector(`input[name="ch_choice_${cfg.secId}"]:checked`);
        if (!selected) {
          alert('Vui lòng chọn 1 phương án dự đoán trước khi kiểm chứng!');
          return;
        }
        const userChoice = parseInt(selected.value, 10);
        const isCorrect = (userChoice === ch.answer);

        // Auto-run scenario
        if (ch.scenario && cfg.onRunChallengeScenario) {
          cfg.onRunChallengeScenario(ch.scenario);
        }

        resBox.style.display = 'block';
        if (isCorrect) {
          resBox.className = 'ch-result-box ok';
          resBox.innerHTML = `
            <div class="res-badge ok">&#10004; CHÍNH XÁC</div>
            <div class="res-explain">${ch.explain}</div>
          `;
          if (cfg.secId && window.ProgressEngine) {
            ProgressEngine.markChallengePassed(cfg.secId);
          }
          if (window.AudioEngine) {
            AudioEngine.playCorrect();
          }
          if (window.triggerEnergyConduitBeam) {
            window.triggerEnergyConduitBeam(confirmBtn);
          }
        } else {
          resBox.className = 'ch-result-box fail';
          resBox.innerHTML = `
            <div class="res-badge fail">&#10008; CHƯA CHÍNH XÁC</div>
            <div class="res-explain">${ch.explain}</div>
          `;
          if (window.AudioEngine) AudioEngine.playWrong();
        }
      });
    }
    renderChallenge();
  }

  const shellProxy = {
    leftPanel,
    rightPanel,
    shellEl,
    dataset: { secId: cfg.secId || '' },
    querySelector: findEl,
    querySelectorAll: findAll,
    get parentNode() {
      return (leftPanel && leftPanel.parentNode) || (shellEl && shellEl.parentNode) || null;
    }
  };

  return {
    shell: shellProxy,
    g3d,
    plot,
    controlsContainer,
    updateReadout,
    onUserInteract,
    get isPaused() { return isSimPaused; },
    destroy() {
      g3d.destroy();
      if (plot && plot.destroy) plot.destroy();
      if (leftPanel && leftPanel.parentNode) leftPanel.parentNode.removeChild(leftPanel);
      if (rightPanel && rightPanel.parentNode) rightPanel.parentNode.removeChild(rightPanel);
      if (shellEl && shellEl.parentNode) shellEl.parentNode.removeChild(shellEl);
    }
  };
}

const SIMS = {};

/* ==========================================================================
   SIMULATION 1 & 2: SIMS.gasBox (thermal & ideal)
   ========================================================================== */
SIMS.gasBox = function(container, options = {}) {
  const mode = options.mode || 'thermal';
  const isThermal = (mode === 'thermal');
  const accentColor = isThermal ? '#FF8A00' : '#00F5A0';
  const secId = options.secId || (isThermal ? 'sec-1.1.1' : 'sec-2.1.1');

  let T = 300; // Kelvin
  let N = 60;  // particles
  let V = 1.0; // Liter = 1e-3 m³
  const k_B = 1.380649e-23;
  const m_particle = 4.65e-26; // ~N2 molecule mass in kg
  const boxHalf = 1.8;

  // Challenges from CURRICULUM
  const challenges = [
    {
      q: isThermal
        ? "Nếu tăng nhiệt độ tuyệt đối T lên gấp 4 lần (từ 200 K lên 800 K), động năng tịnh tiến trung bình Eđ và tốc độ căn quân phương v_rms sẽ thay đổi thế nào?"
        : "Giữ nguyên nhiệt độ T và thể tích V, nếu số phân tử N tăng gấp đôi thì áp suất p thay đổi thế nào?",
      choices: isThermal
        ? ["Eđ tăng 4 lần, v_rms tăng 2 lần", "Eđ tăng 2 lần, v_rms tăng 4 lần", "Eđ và v_rms đều tăng 4 lần"]
        : ["Áp suất p tăng gấp đôi", "Áp suất p không đổi", "Áp suất p giảm một nửa"],
      answer: 0,
      scenario: { set: isThermal ? { T: 800 } : { N: 120 } },
      explain: isThermal
        ? "Theo Eđ = (3/2)kT, động năng tỉ lệ thuận với T (tăng 4 lần). Tốc độ v_rms = √(3kT/m) tỉ lệ với √T nên tăng 2 lần."
        : "Áp suất p = NkT/V tỉ lệ thuận với mật độ phân tử. Số va chạm trong một giây tăng gấp đôi nên p tăng 2 lần."
    },
    {
      q: isThermal
        ? "Ở cùng nhiệt độ T = 300 K, động năng tịnh tiến trung bình của phân tử Hêli (nhẹ) và Ôxi (nặng) quan hệ thế nào?"
        : "Khi giảm nhiệt độ từ 600 K xuống 300 K ở thể tích không đổi, áp suất của khối khí sẽ:",
      choices: isThermal
        ? ["Bằng nhau vì cùng nhiệt độ T", "Hêli lớn hơn vì nhẹ hơn", "Ôxi lớn hơn vì khối lượng lớn hơn"]
        : ["Giảm đi một nửa (giảm 2 lần)", "Tăng gấp đôi", "Không đổi"],
      answer: isThermal ? 0 : 0,
      scenario: { set: isThermal ? { T: 300 } : { T: 300 } },
      explain: isThermal
        ? "Động năng tịnh tiến trung bình Eđ = (3/2)kT chỉ phụ thuộc duy nhất vào nhiệt độ T, không phụ thuộc khối lượng phân tử."
        : "Theo định luật Gay-Lussac cho quá trình đẳng tích: p/T = const. Khi T giảm 2 lần thì p giảm 2 lần."
    }
  ];

  // Presets
  const presets = isThermal ? [
    { label: "Nhiệt độ phòng (300 K)", T: 300, N: 60 },
    { label: "Hạ nhiệt sâu (120 K)", T: 120, N: 60 },
    { label: "Nung nóng (850 K)", T: 850, N: 80 }
  ] : [
    { label: "Chuẩn (1 atm)", T: 300, N: 60 },
    { label: "Mật độ cao (N = 120)", T: 300, N: 120 },
    { label: "Nhiệt cao áp cao", T: 750, N: 100 }
  ];

  const readouts = {
    T: { label: 'Nhiệt độ T' },
    Ed: { label: 'Động năng E_đ' },
    v_rms: { label: 'Tốc độ v_rms' },
    p: { label: 'Áp suất lí thuyết p' }
  };

  const shell = createSimShell(container, {
    secId,
    accentColor,
    plotTitle: isThermal ? 'Phân bố tốc độ Maxwell - Boltzmann' : 'Biến thiên áp suất p theo thời gian',
    plotXLabel: isThermal ? 'v (m/s)' : 't (s)',
    plotYLabel: isThermal ? 'f(v)' : 'p (kPa)',
    plotConfig: isThermal ? { xMin: 0, xMax: 1200, yMin: 0, yMax: 1 } : { xMin: 0, xMax: 10, yMin: 0, yMax: 300 },
    presets,
    readouts,
    challenges,
    onApplyPreset: (pr) => {
      if (pr.T) { T = pr.T; sliderT.value = T; }
      if (pr.N) { N = pr.N; sliderN.value = N; }
      reinitVelocities();
    },
    onRunChallengeScenario: (sc) => {
      if (sc.set) {
        if (sc.set.T) { T = sc.set.T; sliderT.value = T; }
        if (sc.set.N) { N = sc.set.N; sliderN.value = N; }
        reinitVelocities();
      }
    }
  });

  // Slider controls
  const cList = shell.controlsContainer;
  cList.innerHTML = `
    <div class="ctrl-group">
      <div class="ctrl-top"><span class="ctrl-label">Nhiệt độ T:</span><span class="ctrl-num" id="valT">${T} K</span></div>
      <input type="range" class="sim-slider" id="slT" min="100" max="1000" step="10" value="${T}">
    </div>
    <div class="ctrl-group">
      <div class="ctrl-top"><span class="ctrl-label">Số phân tử mô phỏng N:</span><span class="ctrl-num" id="valN">${N}</span></div>
      <input type="range" class="sim-slider" id="slN" min="20" max="150" step="5" value="${N}">
    </div>
  `;

  const sliderT = cList.querySelector('#slT');
  const sliderN = cList.querySelector('#slN');
  const dispT = cList.querySelector('#valT');
  const dispN = cList.querySelector('#valN');

  sliderT.addEventListener('input', () => {
    T = parseFloat(sliderT.value);
    dispT.textContent = `${T} K`;
    reinitVelocities();
    shell.onUserInteract();
    if (window.AudioEngine) AudioEngine.playTick();
  });

  sliderN.addEventListener('input', () => {
    N = parseInt(sliderN.value, 10);
    dispN.textContent = `${N}`;
    adjustParticlesCount();
    shell.onUserInteract();
    if (window.AudioEngine) AudioEngine.playTick();
  });

  // Particles simulation
  const particles = [];
  function createParticle() {
    return {
      x: (Math.random() * 2 - 1) * (boxHalf - 0.2),
      y: (Math.random() * 2 - 1) * (boxHalf - 0.2),
      z: (Math.random() * 2 - 1) * (boxHalf - 0.2),
      vx: 0, vy: 0, vz: 0, speed: 0
    };
  }

  function sampleMaxwellSpeed(temp) {
    const sigma = Math.sqrt((k_B * temp) / m_particle) * 0.003;
    const u1 = Math.random(), u2 = Math.random();
    return Math.sqrt(-2.0 * Math.log(u1 || 1e-6)) * Math.cos(2.0 * Math.PI * u2) * sigma;
  }

  function reinitVelocities() {
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      p.vx = sampleMaxwellSpeed(T);
      p.vy = sampleMaxwellSpeed(T);
      p.vz = sampleMaxwellSpeed(T);
      p.speed = Math.hypot(p.vx, p.vy, p.vz);
    }
  }

  function adjustParticlesCount() {
    while (particles.length < N) particles.push(createParticle());
    while (particles.length > N) particles.pop();
    reinitVelocities();
  }

  adjustParticlesCount();

  // Physics animation loop
  let rAF = null;
  let pHistory = [];
  let tSim = 0;

  function update() {
    if (!shell.isPaused) {
      tSim += 0.02;
      const v_rms_real = Math.sqrt((3 * k_B * T) / m_particle);
      const E_d = 1.5 * k_B * T;
      const p_real_kPa = (N * 1e21 * k_B * T) / (V * 1e-3) / 1000;

      shell.updateReadout('T', `${T} K`);
      shell.updateReadout('Ed', formatSciVi(E_d, 'J'));
      shell.updateReadout('v_rms', `${formatViNum(v_rms_real, 1)} m/s`);
      shell.updateReadout('p', `${formatViNum(p_real_kPa, 1)} kPa`);

      // Clear Geo3D primitives
      shell.g3d.clearPrimitives();

      // Draw wireframe box
      shell.g3d.addBox(Geo3D.v3(0, 0, 0), Geo3D.v3(boxHalf * 2, boxHalf * 2, boxHalf * 2), accentColor);

      // Move particles and detect wall bounces
      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.z += p.vz;

        let hit = false;
        if (p.x < -boxHalf) { p.x = -boxHalf; p.vx = -p.vx; hit = true; }
        else if (p.x > boxHalf) { p.x = boxHalf; p.vx = -p.vx; hit = true; }
        if (p.y < -boxHalf) { p.y = -boxHalf; p.vy = -p.vy; hit = true; }
        else if (p.y > boxHalf) { p.y = boxHalf; p.vy = -p.vy; hit = true; }
        if (p.z < -boxHalf) { p.z = -boxHalf; p.vz = -p.vz; hit = true; }
        else if (p.z > boxHalf) { p.z = boxHalf; p.vz = -p.vz; hit = true; }

        if (hit && window.AudioEngine) {
          AudioEngine.simWallHit(p.speed);
        }

        // Particle color based on speed
        let col = '#00E5FF';
        if (p.speed > 0.05) col = '#FF3B30';
        else if (p.speed > 0.03) col = '#FF8A00';
        else if (p.speed > 0.015) col = '#00F5A0';

        shell.g3d.addPoint(Geo3D.v3(p.x, p.y, p.z), col, 3.5, true);
      }

      // Graph update
      if (isThermal) {
        // Maxwell speed distribution
        shell.plot.setStaticCurve((v) => {
          const a = m_particle / (2 * k_B * T);
          return Math.pow(v / 400, 2) * Math.exp(-a * v * v * 1e-5);
        });
        shell.plot.setMarker({ x: v_rms_real, y: 0.6, label: `v_rms: ${Math.round(v_rms_real)} m/s` });
      } else {
        // Pressure vs time trace
        pHistory.push({ x: tSim, y: p_real_kPa + (Math.random() - 0.5) * 8 });
        if (pHistory.length > 50) pHistory.shift();
        shell.plot.setDomain(Math.max(0, tSim - 8), tSim + 1, 0, Math.max(300, p_real_kPa * 1.5));
        shell.plot.setLiveSeries(pHistory);
        shell.plot.setMarker({ x: tSim, y: p_real_kPa, label: `${Math.round(p_real_kPa)} kPa` });
      }
    }

    shell.g3d.render();
    shell.plot.render();
    rAF = requestAnimationFrame(update);
  }

  shell.g3d.resize();
  shell.plot.resize();
  rAF = requestAnimationFrame(update);

  return {
    destroy() {
      if (rAF) cancelAnimationFrame(rAF);
      shell.destroy();
    }
  };
};

/* ==========================================================================
   SIMULATION 3: SIMS.gasPiston (sec-2.1.2)
   ========================================================================== */
SIMS.gasPiston = function(container, options = {}) {
  const accentColor = '#00F5A0';
  const secId = 'sec-2.1.2';
  let V = 3.0; // Liters (1.0 to 5.0)
  const n_mol = 0.12;
  const T = 300;
  const R = 8.314;

  const presets = [
    { label: "Chuẩn (3,0 L · 100 kPa)", V: 3.0 },
    { label: "Nén còn 1/2V (1,5 L · 200 kPa)", V: 1.5 },
    { label: "Giãn gấp đôi (4,5 L · 67 kPa)", V: 4.5 }
  ];

  const readouts = {
    V: { label: 'Thể tích V' },
    p: { label: 'Áp suất p = nRT/V' },
    pV: { label: 'Tích p·V (hằng số)' },
    T: { label: 'Nhiệt độ T (đẳng nhiệt)' }
  };

  const challenges = [
    {
      q: "Trong quá trình đẳng nhiệt của một lượng khí lí tưởng, nếu thể tích V giảm đi một nửa thì áp suất p sẽ:",
      choices: ["Tăng gấp 2 lần", "Giảm đi một nửa", "Không đổi"],
      answer: 0,
      scenario: { set: { V: 1.5 } },
      explain: "Theo định luật Boyle: p₁·V₁ = p₂·V₂ = const. Khi V giảm 2 lần thì p tăng gấp 2 lần."
    },
    {
      q: "Đồ thị biểu diễn mối liên hệ p theo 1/V trong quá trình đẳng nhiệt có hình dạng là:",
      choices: ["Đường thẳng đi qua gốc toạ độ", "Đường hypebol", "Đường tròn"],
      answer: 0,
      scenario: { set: { V: 2.0 } },
      explain: "Vì p = const · (1/V), hàm số có dạng y = ax (với x = 1/V), nên đồ thị là đường thẳng đi qua gốc toạ độ."
    }
  ];

  const shell = createSimShell(container, {
    secId,
    accentColor,
    plotTitle: 'Đường đẳng nhiệt p - V (Boyle - Mariotte)',
    plotXLabel: 'V (L)',
    plotYLabel: 'p (kPa)',
    plotConfig: { xMin: 1.0, xMax: 5.0, yMin: 0, yMax: 350 },
    presets,
    readouts,
    challenges,
    onApplyPreset: (pr) => {
      if (pr.V) { V = pr.V; sliderV.value = V; }
    },
    onRunChallengeScenario: (sc) => {
      if (sc.set && sc.set.V) { V = sc.set.V; sliderV.value = V; }
    }
  });

  const cList = shell.controlsContainer;
  cList.innerHTML = `
    <div class="ctrl-group">
      <div class="ctrl-top"><span class="ctrl-label">Thể tích xi-lanh V:</span><span class="ctrl-num" id="valV">${formatViNum(V, 1)} L</span></div>
      <input type="range" class="sim-slider" id="slV" min="1.0" max="5.0" step="0.1" value="${V}">
    </div>
  `;
  const sliderV = cList.querySelector('#slV');
  const dispV = cList.querySelector('#valV');

  sliderV.addEventListener('input', () => {
    V = parseFloat(sliderV.value);
    dispV.textContent = `${formatViNum(V, 1)} L`;
    shell.onUserInteract();
    if (window.AudioEngine) AudioEngine.playTick();
  });

  // Particles inside cylinder
  const particles = [];
  for (let i = 0; i < 50; i++) {
    particles.push({
      r: Math.random() * 1.1,
      theta: Math.random() * Math.PI * 2,
      yFrac: Math.random(),
      vy: (Math.random() - 0.5) * 0.04
    });
  }

  // Hyperbola curve
  const C_const = (n_mol * R * T) / 1000 * 1000; // ≈ 299.3 kPa·L
  shell.plot.setStaticCurve((v) => C_const / Math.max(0.1, v));

  let rAF = null;
  function update() {
    if (!shell.isPaused) {
      const p_kPa = C_const / V;
      shell.updateReadout('V', `${formatViNum(V, 2)} L`);
      shell.updateReadout('p', `${formatViNum(p_kPa, 1)} kPa`);
      shell.updateReadout('pV', `${formatViNum(p_kPa * V, 1)} kPa·L`);
      shell.updateReadout('T', `${T} K`);

      shell.plot.setMarker({ x: V, y: p_kPa, label: `(${formatViNum(V, 1)}L; ${Math.round(p_kPa)}kPa)` });

      shell.g3d.clearPrimitives();

      // Piston cylinder base at y = -1.8, top height proportional to V
      const baseY = -1.8;
      const pistonY = baseY + (V / 5.0) * 3.4;

      // Outer cylinder wire rings
      for (let y = baseY; y <= 1.8; y += 0.8) {
        shell.g3d.addCircle(Geo3D.v3(0, y, 0), Geo3D.v3(0, 1, 0), 1.3, 'rgba(53,224,255,0.25)');
      }
      // Piston head disk
      shell.g3d.addCircle(Geo3D.v3(0, pistonY, 0), Geo3D.v3(0, 1, 0), 1.28, accentColor);
      shell.g3d.addSphere(Geo3D.v3(0, pistonY + 0.3, 0), 0.25, '#FFFFFF');
      shell.g3d.addLine(Geo3D.v3(0, pistonY, 0), Geo3D.v3(0, pistonY + 1.2, 0), '#EAF4FF', 4);

      // Gas particles in cylinder
      particles.forEach(p => {
        p.yFrac += p.vy;
        if (p.yFrac < 0) { p.yFrac = 0; p.vy = -p.vy; }
        if (p.yFrac > 1) { p.yFrac = 1; p.vy = -p.vy; }
        const py = baseY + p.yFrac * (pistonY - baseY);
        const px = p.r * Math.cos(p.theta);
        const pz = p.r * Math.sin(p.theta);
        shell.g3d.addPoint(Geo3D.v3(px, py, pz), accentColor, 3.5, true);
      });
    }

    shell.g3d.render();
    shell.plot.render();
    rAF = requestAnimationFrame(update);
  }

  shell.g3d.resize();
  shell.plot.resize();
  rAF = requestAnimationFrame(update);

  return {
    destroy() {
      if (rAF) cancelAnimationFrame(rAF);
      shell.destroy();
    }
  };
};

/* ==========================================================================
   SIMULATION 4: SIMS.wireFieldRings (sec-3.1.1)
   ========================================================================== */
SIMS.wireFieldRings = function(container, options = {}) {
  const accentColor = '#00E5FF';
  const secId = 'sec-3.1.1';
  let I = 10.0; // Amperes (0 to 20 A)
  let I_dir = 1; // 1 = up, -1 = down
  let r_probe = 5.0; // cm (2 to 30 cm)

  const presets = [
    { label: "Dòng 10 A · Cự li 5 cm (40 µT)", I: 10, dir: 1, r: 5 },
    { label: "Dòng cực đại 20 A · Cận cảnh 3 cm", I: 20, dir: 1, r: 3 },
    { label: "Đảo chiều dòng điện (↓ 10 A)", I: 10, dir: -1, r: 5 }
  ];

  const readouts = {
    I: { label: 'Cường độ dòng điện I' },
    dir: { label: 'Chiều dòng điện' },
    r: { label: 'Khoảng cách r' },
    B: { label: 'Cảm ứng từ B = 2·10⁻⁷·I/r' }
  };

  const challenges = [
    {
      q: "Khi tăng khoảng cách từ điểm khảo sát đến dây dẫn thẳng dài lên gấp 3 lần (r' = 3r), độ lớn cảm ứng từ B sẽ:",
      choices: ["Giảm đi 3 lần", "Tăng lên 3 lần", "Giảm đi 9 lần"],
      answer: 0,
      scenario: { set: { r: 15 } },
      explain: "Công thức B = 2×10⁻⁷·(I/r) tỉ lệ nghịch với khoảng cách r. Khoảng cách tăng 3 lần thì B giảm 3 lần."
    },
    {
      q: "Nếu đảo chiều dòng điện I trong dây dẫn thẳng đứng từ dưới lên thành từ trên xuống, chiều các đường sức từ sẽ:",
      choices: ["Đảo chiều quay ngược lại theo quy tắc nắm tay phải", "Giữ nguyên không đổi", "Bị triệt tiêu"],
      answer: 0,
      scenario: { set: { dir: -1 } },
      explain: "Theo quy tắc nắm tay phải, ngón cái đảo từ hướng lên sang hướng xuống khiến chiều cong của 4 ngón tay bị đảo ngược."
    }
  ];

  const shell = createSimShell(container, {
    secId,
    accentColor,
    plotTitle: 'Quan hệ cảm ứng từ B theo khoảng cách r (∝ 1/r)',
    plotXLabel: 'r (cm)',
    plotYLabel: 'B (µT)',
    plotConfig: { xMin: 2, xMax: 30, yMin: 0, yMax: 120 },
    presets,
    readouts,
    challenges,
    onApplyPreset: (pr) => {
      if (pr.I !== undefined) { I = pr.I; sliderI.value = I; }
      if (pr.dir !== undefined) { I_dir = pr.dir; btnDir.textContent = I_dir === 1 ? '↑ Lên trên' : '↓ Xuống dưới'; }
      if (pr.r !== undefined) { r_probe = pr.r; sliderR.value = r_probe; }
    },
    onRunChallengeScenario: (sc) => {
      if (sc.set) {
        if (sc.set.r) { r_probe = sc.set.r; sliderR.value = r_probe; }
        if (sc.set.dir) { I_dir = sc.set.dir; btnDir.textContent = I_dir === 1 ? '↑ Lên trên' : '↓ Xuống dưới'; }
      }
    }
  });

  const cList = shell.controlsContainer;
  cList.innerHTML = `
    <div class="ctrl-group">
      <div class="ctrl-top"><span class="ctrl-label">Cường độ dòng điện I:</span><span class="ctrl-num" id="valI">${I} A</span></div>
      <input type="range" class="sim-slider" id="slI" min="0" max="20" step="0.5" value="${I}">
    </div>
    <div class="ctrl-group">
      <div class="ctrl-top"><span class="ctrl-label">Chiều dòng điện:</span></div>
      <button type="button" class="btn" id="btnDir" style="padding:6px 12px;font-size:12px;">↑ Lên trên</button>
    </div>
    <div class="ctrl-group">
      <div class="ctrl-top"><span class="ctrl-label">Khoảng cách đầu đo r:</span><span class="ctrl-num" id="valR">${r_probe} cm</span></div>
      <input type="range" class="sim-slider" id="slR" min="2" max="30" step="0.5" value="${r_probe}">
    </div>
  `;

  const sliderI = cList.querySelector('#slI');
  const btnDir = cList.querySelector('#btnDir');
  const sliderR = cList.querySelector('#slR');
  const dispI = cList.querySelector('#valI');
  const dispR = cList.querySelector('#valR');

  sliderI.addEventListener('input', () => {
    I = parseFloat(sliderI.value);
    dispI.textContent = `${I} A`;
    shell.onUserInteract();
    if (window.AudioEngine) AudioEngine.playTick();
  });

  btnDir.addEventListener('click', () => {
    I_dir = -I_dir;
    btnDir.textContent = I_dir === 1 ? '↑ Lên trên' : '↓ Xuống dưới';
    shell.onUserInteract();
    if (window.AudioEngine) AudioEngine.playClick();
  });

  sliderR.addEventListener('input', () => {
    r_probe = parseFloat(sliderR.value);
    dispR.textContent = `${r_probe} cm`;
    shell.onUserInteract();
    if (window.AudioEngine) AudioEngine.playTick();
  });

  // 1/r plot curve
  shell.plot.setStaticCurve((r) => (2e-7 * I / (r * 0.01)) * 1e6);

  let rAF = null;
  let flowAngle = 0;

  function update() {
    if (!shell.isPaused) {
      flowAngle += 0.03 * I_dir * Math.max(0.1, I / 10);
      const B_T = 2e-7 * I / (r_probe * 0.01);
      const B_uT = B_T * 1e6;

      shell.updateReadout('I', `${I} A`);
      shell.updateReadout('dir', I_dir === 1 ? 'Hướng lên trên (+Y)' : 'Hướng xuống dưới (-Y)');
      shell.updateReadout('r', `${r_probe} cm = ${(r_probe * 0.01).toFixed(2)} m`);
      shell.updateReadout('B', `${formatViNum(B_uT, 1)} µT (${formatSciVi(B_T, 'T')})`);

      shell.plot.setStaticCurve((r) => (2e-7 * I / (r * 0.01)) * 1e6);
      shell.plot.setMarker({ x: r_probe, y: B_uT, label: `${Math.round(B_uT)} µT` });

      shell.g3d.clearPrimitives();

      // Central wire
      shell.g3d.addLine(Geo3D.v3(0, -2.5, 0), Geo3D.v3(0, 2.5, 0), '#FF8A00', 5, true);
      // Current arrow
      const arrowY = I_dir === 1 ? 1.0 : -1.0;
      shell.g3d.addArrow(Geo3D.v3(0, 0, 0), Geo3D.v3(0, arrowY * 1.5, 0), '#FFFFFF', 0.4, 'I');

      // Concentric circular field rings
      const radii = [0.8, 1.4, 2.0, 2.6];
      radii.forEach(rad => {
        shell.g3d.addCircle(Geo3D.v3(0, 0, 0), Geo3D.v3(0, 1, 0), rad, accentColor);
        // Flowing arrows along circle
        for (let a = 0; a < 3; a++) {
          const theta = flowAngle + a * ((Math.PI * 2) / 3);
          const px = rad * Math.cos(theta);
          const pz = rad * Math.sin(theta);
          const tx = -Math.sin(theta) * I_dir * 0.3;
          const tz = Math.cos(theta) * I_dir * 0.3;
          shell.g3d.addArrow(Geo3D.v3(px, 0, pz), Geo3D.v3(px + tx, 0, pz + tz), accentColor, 0.2);
        }
      });

      // Probe point in 3D
      const probe3dRad = (r_probe / 30) * 2.8;
      const probePos = Geo3D.v3(probe3dRad, 0, 0);
      shell.g3d.addSphere(probePos, 0.12, '#FFFFFF');
      // Tangent B vector at probe
      const bVecLen = Math.min(1.2, (B_uT / 60) * 0.8) * I_dir;
      shell.g3d.addArrow(probePos, Geo3D.v3(probe3dRad, 0, bVecLen), '#00F5A0', 0.3, 'B');
    }

    shell.g3d.render();
    shell.plot.render();
    rAF = requestAnimationFrame(update);
  }

  shell.g3d.resize();
  shell.plot.resize();
  rAF = requestAnimationFrame(update);

  return {
    destroy() {
      if (rAF) cancelAnimationFrame(rAF);
      shell.destroy();
    }
  };
};

/* ==========================================================================
   SIMULATION 5: SIMS.railForce (sec-3.1.2)
   ========================================================================== */
SIMS.railForce = function(container, options = {}) {
  const accentColor = '#00E5FF';
  const secId = 'sec-3.1.2';
  let I = 4.0; // A (0 to 10 A)
  let I_dir = 1; // 1 or -1
  let B = 0.5; // T (0.1 to 1.0 T)
  let B_dir = 1; // 1 = up, -1 = down
  const L = 0.5; // m

  let barX = 0;
  let barV = 0;

  const presets = [
    { label: "Chuẩn (I = 4 A · B = 0,5 T · F = 1,0 N)", I: 4, B: 0.5, I_dir: 1, B_dir: 1 },
    { label: "Lực cực đại (I = 8 A · B = 0,8 T)", I: 8, B: 0.8, I_dir: 1, B_dir: 1 },
    { label: "Đảo chiều lực (Đổi cực ắc quy)", I: 4, B: 0.5, I_dir: -1, B_dir: 1 }
  ];

  const readouts = {
    I: { label: 'Cường độ dòng điện I' },
    B: { label: 'Cảm ứng từ B' },
    F: { label: 'Lực Laplace F = B·I·L' },
    v: { label: 'Vận tốc thanh v' }
  };

  const challenges = [
    {
      q: "Khi đảo chiều đồng thời cả dòng điện I và vectơ cảm ứng từ B, chiều của lực từ F tác dụng lên thanh ray sẽ:",
      choices: ["Không đổi", "Bị đảo ngược", "Chuyển sang vuông góc với đường ray"],
      answer: 0,
      scenario: { set: { I_dir: -1, B_dir: -1 } },
      explain: "Vì lực Laplace F = I·(L × B), khi cả I và B đổi chiều, tích có hướng đổi dấu hai lần nên lực F giữ nguyên chiều."
    },
    {
      q: "Đoạn dây l = 0,5 m vuông góc với B = 0,4 T, có dòng điện I = 5 A chạy qua. Độ lớn lực Laplace là:",
      choices: ["1,0 N", "2,0 N", "0,5 N"],
      answer: 0,
      scenario: { set: { I: 5, B: 0.4 } },
      explain: "F = B · I · l · sin(90°) = 0,4 × 5 × 0,5 × 1 = 1,0 N."
    }
  ];

  const shell = createSimShell(container, {
    secId,
    accentColor,
    plotTitle: 'Quan hệ Lực Laplace F theo dòng điện I (F = B·I·L)',
    plotXLabel: 'I (A)',
    plotYLabel: 'F (N)',
    plotConfig: { xMin: 0, xMax: 10, yMin: 0, yMax: 5.0 },
    presets,
    readouts,
    challenges,
    onApplyPreset: (pr) => {
      if (pr.I !== undefined) { I = pr.I; sliderI.value = I; }
      if (pr.B !== undefined) { B = pr.B; sliderB.value = B; }
      if (pr.I_dir !== undefined) I_dir = pr.I_dir;
      if (pr.B_dir !== undefined) B_dir = pr.B_dir;
      barX = 0; barV = 0;
    },
    onRunChallengeScenario: (sc) => {
      if (sc.set) {
        if (sc.set.I) { I = sc.set.I; sliderI.value = I; }
        if (sc.set.B) { B = sc.set.B; sliderB.value = B; }
        if (sc.set.I_dir) I_dir = sc.set.I_dir;
        if (sc.set.B_dir) B_dir = sc.set.B_dir;
        barX = 0; barV = 0;
      }
    }
  });

  const cList = shell.controlsContainer;
  cList.innerHTML = `
    <div class="ctrl-group">
      <div class="ctrl-top"><span class="ctrl-label">Cường độ dòng điện I:</span><span class="ctrl-num" id="valI">${I} A</span></div>
      <input type="range" class="sim-slider" id="slI" min="0" max="10" step="0.2" value="${I}">
    </div>
    <div class="ctrl-group">
      <div class="ctrl-top"><span class="ctrl-label">Cảm ứng từ B:</span><span class="ctrl-num" id="valB">${B} T</span></div>
      <input type="range" class="sim-slider" id="slB" min="0.1" max="1.0" step="0.05" value="${B}">
    </div>
    <div style="display:flex;gap:8px;margin-top:6px;">
      <button type="button" class="btn" id="btnPol" style="flex:1;padding:6px;font-size:11px;">Đảo cực Ắc-quy (±)</button>
      <button type="button" class="btn" id="btnBDir" style="flex:1;padding:6px;font-size:11px;">Đảo chiều từ trường</button>
    </div>
  `;

  const sliderI = cList.querySelector('#slI');
  const sliderB = cList.querySelector('#slB');
  const btnPol = cList.querySelector('#btnPol');
  const btnBDir = cList.querySelector('#btnBDir');
  const dispI = cList.querySelector('#valI');
  const dispB = cList.querySelector('#valB');

  sliderI.addEventListener('input', () => {
    I = parseFloat(sliderI.value);
    dispI.textContent = `${I} A`;
    shell.onUserInteract();
    if (window.AudioEngine) AudioEngine.playTick();
  });

  sliderB.addEventListener('input', () => {
    B = parseFloat(sliderB.value);
    dispB.textContent = `${B} T`;
    shell.onUserInteract();
    if (window.AudioEngine) AudioEngine.playTick();
  });

  btnPol.addEventListener('click', () => {
    I_dir = -I_dir;
    shell.onUserInteract();
    if (window.AudioEngine) AudioEngine.playClick();
  });

  btnBDir.addEventListener('click', () => {
    B_dir = -B_dir;
    shell.onUserInteract();
    if (window.AudioEngine) AudioEngine.playClick();
  });

  let rAF = null;
  function update() {
    if (!shell.isPaused) {
      // Force F = I * L * B * sign
      const forceVal = B * I * L;
      const forceDir = I_dir * B_dir; // +1 = right, -1 = left
      const F_net = forceVal * forceDir;

      // Kinematics: bar rolling on rails
      const mass = 0.15; // kg
      const a = (F_net - barV * 0.8) / mass;
      barV += a * 0.02;
      barX += barV * 0.02;

      // Bounce at rails bounds
      if (barX > 2.0) { barX = 2.0; barV = -barV * 0.5; }
      else if (barX < -2.0) { barX = -2.0; barV = -barV * 0.5; }

      shell.updateReadout('I', `${I} A (${I_dir === 1 ? '+I' : '-I'})`);
      shell.updateReadout('B', `${formatViNum(B, 2)} T (${B_dir === 1 ? '↑ Lên' : '↓ Xuống'})`);
      shell.updateReadout('F', `${formatViNum(forceVal, 2)} N (${forceDir === 1 ? '→ Phải' : '← Trái'})`);
      shell.updateReadout('v', `${formatViNum(Math.abs(barV), 2)} m/s`);

      // Plot line F = (B*L) * I
      shell.plot.setStaticCurve((i) => B * i * L);
      shell.plot.setMarker({ x: I, y: forceVal, label: `${formatViNum(forceVal, 2)} N` });

      shell.g3d.clearPrimitives();

      // Parallel conducting rails
      shell.g3d.addLine(Geo3D.v3(-2.4, 0, -1.0), Geo3D.v3(2.4, 0, -1.0), '#448AFF', 4);
      shell.g3d.addLine(Geo3D.v3(-2.4, 0, 1.0), Geo3D.v3(2.4, 0, 1.0), '#448AFF', 4);

      // B-field arrow grid
      for (let gx = -1.8; gx <= 1.8; gx += 1.2) {
        for (let gz = -0.6; gz <= 0.6; gz += 1.2) {
          const by = B_dir * 0.9;
          shell.g3d.addArrow(Geo3D.v3(gx, -by * 0.5, gz), Geo3D.v3(gx, by * 0.5, gz), 'rgba(0,229,255,0.3)', 0.15);
        }
      }

      // Rolling crossbar
      shell.g3d.addLine(Geo3D.v3(barX, 0, -1.1), Geo3D.v3(barX, 0, 1.1), '#FF8A00', 8, true);
      shell.g3d.addSphere(Geo3D.v3(barX, 0, -1.0), 0.15, '#FFFFFF');
      shell.g3d.addSphere(Geo3D.v3(barX, 0, 1.0), 0.15, '#FFFFFF');

      // Laplace Force Arrow on crossbar
      if (Math.abs(forceVal) > 0.05) {
        const arrowLen = forceDir * Math.min(1.5, forceVal * 0.6);
        shell.g3d.addArrow(Geo3D.v3(barX, 0.2, 0), Geo3D.v3(barX + arrowLen, 0.2, 0), '#FF3B30', 0.3, 'F');
      }
    }

    shell.g3d.render();
    shell.plot.render();
    rAF = requestAnimationFrame(update);
  }

  shell.g3d.resize();
  shell.plot.resize();
  rAF = requestAnimationFrame(update);

  return {
    destroy() {
      if (rAF) cancelAnimationFrame(rAF);
      shell.destroy();
    }
  };
};

/* ==========================================================================
   SIMULATION 6: SIMS.lorentzHelix (sec-3.1.3)
   ========================================================================== */
SIMS.lorentzHelix = function(container, options = {}) {
  const accentColor = '#00E5FF';
  const secId = 'sec-3.1.3';
  let v = 3.0e6; // m/s (1e5 to 1e7)
  let B = 10.0e-3; // T (1 to 50 mT)
  let alphaDeg = 60; // deg (5 to 90)
  let sign = 1; // +1 or -1
  let isElectron = true;

  const m_e = 9.109e-31, q_e = 1.602e-19;
  const m_p = 1.673e-27, q_p = 1.602e-19;

  const presets = [
    { label: "Xoắn ốc chuẩn (α = 60° · 3×10⁶ m/s)", v: 3.0e6, B: 10e-3, alpha: 60 },
    { label: "Chuyển động tròn (α = 90°)", v: 3.0e6, B: 10e-3, alpha: 90 },
    { label: "Chuyển động thẳng (α = 0°)", v: 3.0e6, B: 10e-3, alpha: 5 }
  ];

  const readouts = {
    v: { label: 'Vận tốc v' },
    B: { label: 'Cảm ứng từ B' },
    r: { label: 'Bán kính r = mv·sinα/(|q|B)' },
    T: { label: 'Chu kì T = 2πm/(|q|B)' },
    h: { label: 'Bước xoắn h = v·cosα·T' }
  };

  const challenges = [
    {
      q: "Giữ nguyên từ trường B và góc α, nếu tăng vận tốc v lên gấp đôi thì bán kính quỹ đạo r và chu kì T thay đổi thế nào?",
      choices: ["r tăng gấp đôi, T không đổi", "r tăng gấp đôi, T tăng gấp đôi", "r tăng 4 lần, T không đổi"],
      answer: 0,
      scenario: { set: { v: 6.0e6 } },
      explain: "Bán kính r = (m·v·sinα)/(|q|B) tỉ lệ thuận với v nên tăng 2 lần. Chu kì T = 2πm/(|q|B) không phụ thuộc vào v nên giữ nguyên."
    },
    {
      q: "Nếu hạt mang điện bay song song với các đường sức từ (góc α = 0°), quỹ đạo của hạt sẽ là:",
      choices: ["Đường thẳng đều dọc theo đường sức từ", "Đường tròn bán kính cực đại", "Đường xoắn ốc"],
      answer: 0,
      scenario: { set: { alpha: 5 } },
      explain: "Khi α = 0°, lực Lorentz F_L = |q|vB·sin(0°) = 0. Không có lực gia tốc vuông góc nên hạt chuyển động thẳng đều."
    }
  ];

  const shell = createSimShell(container, {
    secId,
    accentColor,
    plotTitle: 'Hình chiếu quỹ đạo tròn trên mặt phẳng vuông góc B',
    plotXLabel: 'x (mm)',
    plotYLabel: 'y (mm)',
    plotConfig: { xMin: -5, xMax: 5, yMin: -5, yMax: 5 },
    presets,
    readouts,
    challenges,
    onApplyPreset: (pr) => {
      if (pr.v) { v = pr.v; sliderV.value = v / 1e6; }
      if (pr.B) { B = pr.B; sliderB.value = B * 1000; }
      if (pr.alpha) { alphaDeg = pr.alpha; sliderA.value = alphaDeg; }
    },
    onRunChallengeScenario: (sc) => {
      if (sc.set) {
        if (sc.set.v) { v = sc.set.v; sliderV.value = v / 1e6; }
        if (sc.set.alpha) { alphaDeg = sc.set.alpha; sliderA.value = alphaDeg; }
      }
    }
  });

  const cList = shell.controlsContainer;
  cList.innerHTML = `
    <div class="ctrl-group">
      <div class="ctrl-top"><span class="ctrl-label">Vận tốc v (×10⁶ m/s):</span><span class="ctrl-num" id="valV">${formatViNum(v / 1e6, 1)}</span></div>
      <input type="range" class="sim-slider" id="slV" min="0.5" max="10" step="0.5" value="${v / 1e6}">
    </div>
    <div class="ctrl-group">
      <div class="ctrl-top"><span class="ctrl-label">Cảm ứng từ B (mT):</span><span class="ctrl-num" id="valB">${formatViNum(B * 1000, 0)}</span></div>
      <input type="range" class="sim-slider" id="slB" min="1" max="50" step="1" value="${B * 1000}">
    </div>
    <div class="ctrl-group">
      <div class="ctrl-top"><span class="ctrl-label">Góc bắn α (độ):</span><span class="ctrl-num" id="valA">${alphaDeg}°</span></div>
      <input type="range" class="sim-slider" id="slA" min="5" max="90" step="1" value="${alphaDeg}">
    </div>
    <div style="display:flex;gap:8px;margin-top:6px;">
      <button type="button" class="btn" id="btnSign" style="flex:1;padding:6px;font-size:11px;">Điện tích: Âm (-e)</button>
    </div>
  `;

  const sliderV = cList.querySelector('#slV');
  const sliderB = cList.querySelector('#slB');
  const sliderA = cList.querySelector('#slA');
  const btnSign = cList.querySelector('#btnSign');
  const dispV = cList.querySelector('#valV');
  const dispB = cList.querySelector('#valB');
  const dispA = cList.querySelector('#valA');

  sliderV.addEventListener('input', () => {
    v = parseFloat(sliderV.value) * 1e6;
    dispV.textContent = `${formatViNum(v / 1e6, 1)}`;
    shell.onUserInteract();
    if (window.AudioEngine) AudioEngine.playTick();
  });

  sliderB.addEventListener('input', () => {
    B = parseFloat(sliderB.value) * 1e-3;
    dispB.textContent = `${formatViNum(B * 1000, 0)}`;
    shell.onUserInteract();
    if (window.AudioEngine) AudioEngine.playTick();
  });

  sliderA.addEventListener('input', () => {
    alphaDeg = parseFloat(sliderA.value);
    dispA.textContent = `${alphaDeg}°`;
    shell.onUserInteract();
    if (window.AudioEngine) AudioEngine.playTick();
  });

  btnSign.addEventListener('click', () => {
    sign = -sign;
    btnSign.textContent = sign === 1 ? 'Điện tích: Dương (+q)' : 'Điện tích: Âm (-e)';
    shell.onUserInteract();
    if (window.AudioEngine) AudioEngine.playClick();
  });

  let rAF = null;
  let tSim = 0;

  function update() {
    if (!shell.isPaused) {
      tSim += 0.04;
      const alphaRad = (alphaDeg * Math.PI) / 180;
      const m = isElectron ? m_e : m_p;
      const q = isElectron ? q_e : q_p;

      const v_perp = v * Math.sin(alphaRad);
      const v_para = v * Math.cos(alphaRad);

      const r_m = (m * v_perp) / (q * B);
      const T_s = (2 * Math.PI * m) / (q * B);
      const h_m = v_para * T_s;

      const r_mm = r_m * 1000;
      const h_mm = h_m * 1000;

      shell.updateReadout('v', formatSciVi(v, 'm/s'));
      shell.updateReadout('B', `${formatViNum(B * 1000, 1)} mT`);
      shell.updateReadout('r', `${formatViNum(r_mm, 2)} mm`);
      shell.updateReadout('T', formatSciVi(T_s, 's'));
      shell.updateReadout('h', `${formatViNum(h_mm, 2)} mm`);

      // Top down projection on MiniPlot
      shell.plot.setDomain(-r_mm * 1.5, r_mm * 1.5, -r_mm * 1.5, r_mm * 1.5);
      const circlePts = [];
      for (let s = 0; s <= 40; s++) {
        const th = (s / 40) * Math.PI * 2;
        circlePts.push({ x: r_mm * Math.cos(th), y: r_mm * Math.sin(th) });
      }
      shell.plot.setLiveSeries(circlePts);
      const curAngle = tSim * 2 * sign;
      shell.plot.setMarker({ x: r_mm * Math.cos(curAngle), y: r_mm * Math.sin(curAngle), label: `r = ${formatViNum(r_mm, 2)}mm` });

      shell.g3d.clearPrimitives();

      // B-field lines along Z axis
      for (let bx = -1.5; bx <= 1.5; bx += 1.0) {
        for (let by = -1.5; by <= 1.5; by += 1.0) {
          shell.g3d.addArrow(Geo3D.v3(bx, by, -2.5), Geo3D.v3(bx, by, 2.5), 'rgba(53,224,255,0.2)', 0.2);
        }
      }

      // Generate 3D Helix trajectory
      const trajPoints = [];
      const visR = Math.min(1.8, Math.max(0.4, (r_mm / 2.0) * 0.8));
      const visPitch = (h_mm / 10.0) * 0.4;
      const maxZ = 2.4;
      const numTurns = 3.5;

      for (let step = 0; step <= 120; step++) {
        const theta = (step / 120) * (numTurns * Math.PI * 2) * sign;
        const z = -2.0 + (step / 120) * (maxZ * 2);
        const x = visR * Math.cos(theta);
        const y = visR * Math.sin(theta);
        trajPoints.push(Geo3D.v3(x, y, z));
      }

      shell.g3d.addPolyline(trajPoints, accentColor, 3, true);

      // Current particle position moving along helix
      const curTurnFrac = (tSim % 4.0) / 4.0;
      const pTheta = curTurnFrac * (numTurns * Math.PI * 2) * sign;
      const pZ = -2.0 + curTurnFrac * (maxZ * 2);
      const px = visR * Math.cos(pTheta);
      const py = visR * Math.sin(pTheta);

      const pPos = Geo3D.v3(px, py, pZ);
      shell.g3d.addSphere(pPos, 0.18, '#FFFFFF');

      // Lorentz Force Arrow pointing toward helix center axis
      const fArrow = Geo3D.v3_add(pPos, Geo3D.v3(-px * 0.6, -py * 0.6, 0));
      shell.g3d.addArrow(pPos, fArrow, '#FF3B30', 0.25, 'F_L');
    }

    shell.g3d.render();
    shell.plot.render();
    rAF = requestAnimationFrame(update);
  }

  shell.g3d.resize();
  shell.plot.resize();
  rAF = requestAnimationFrame(update);

  return {
    destroy() {
      if (rAF) cancelAnimationFrame(rAF);
      shell.destroy();
    }
  };
};

/* ==========================================================================
   SIMULATION 7: SIMS.fluxLoop (sec-3.2.1)
   ========================================================================== */
SIMS.fluxLoop = function(container, options = {}) {
  const accentColor = '#00E5FF';
  const secId = 'sec-3.2.1';
  let B = 0.5; // Tesla (0.1 to 1.0)
  const S = 0.04; // m²
  let alphaDeg = 0; // 0 to 180
  let isAutoRotate = true;
  let omega = 6.0; // rad/s (1 to 20)

  const presets = [
    { label: "Từ thông cực đại (α = 0° · Φ = BS)", alpha: 0, auto: false },
    { label: "Từ thông bằng 0 (α = 90° · Φ = 0)", alpha: 90, auto: false },
    { label: "Máy phát xoay chiều (ω = 10 rad/s)", omega: 10, auto: true }
  ];

  const readouts = {
    alpha: { label: 'Góc α = (n, B)' },
    B: { label: 'Cảm ứng từ B' },
    Phi: { label: 'Từ thông Φ = B·S·cosα' },
    ec: { label: 'Suất điện động e_c = -dΦ/dt' }
  };

  const challenges = [
    {
      q: "Khi pháp tuyến n của khung dây hợp với vectơ B một góc α = 90° (mặt phẳng khung dây song song với B), từ thông qua khung dây bằng:",
      choices: ["Bằng 0", "Cực đại B·S", "Bằng một nửa cực đại"],
      answer: 0,
      scenario: { set: { alpha: 90, auto: false } },
      explain: "Từ thông Φ = B·S·cosα. Với α = 90°, cos(90°) = 0 nên từ thông bằng 0."
    },
    {
      q: "Khi khung dây quay đều trong từ trường, độ lớn suất điện động cảm ứng |e_c| đạt cực đại khi:",
      choices: ["Mặt phẳng khung dây song song với các đường sức từ (α = 90°)", "Mặt phẳng khung vuông góc với đường sức từ (α = 0°)", "Từ thông đạt cực đại"],
      answer: 0,
      scenario: { set: { auto: true, omega: 10 } },
      explain: "Khi α = 90°, Φ = 0 nhưng tốc độ biến thiên dΦ/dt đạt cực đại, do đó |e_c| = B·S·ω đạt giá trị cực đại."
    }
  ];

  const shell = createSimShell(container, {
    secId,
    accentColor,
    plotTitle: 'Dao động kí: Từ thông Φ(t) & Suất điện động e_c(t)',
    plotXLabel: 't (s)',
    plotYLabel: 'Φ (mWb) / e_c (V)',
    plotConfig: { xMin: 0, xMax: 4, yMin: -30, yMax: 30, secondaryColor: '#FF8A00' },
    presets,
    readouts,
    challenges,
    onApplyPreset: (pr) => {
      if (pr.alpha !== undefined) { alphaDeg = pr.alpha; sliderA.value = alphaDeg; }
      if (pr.auto !== undefined) { isAutoRotate = pr.auto; btnMode.textContent = isAutoRotate ? 'Chế độ: Tự quay' : 'Chế độ: Thủ công'; }
      if (pr.omega !== undefined) { omega = pr.omega; sliderW.value = omega; }
    },
    onRunChallengeScenario: (sc) => {
      if (sc.set) {
        if (sc.set.alpha !== undefined) { alphaDeg = sc.set.alpha; sliderA.value = alphaDeg; }
        if (sc.set.auto !== undefined) { isAutoRotate = sc.set.auto; btnMode.textContent = isAutoRotate ? 'Chế độ: Tự quay' : 'Chế độ: Thủ công'; }
        if (sc.set.omega !== undefined) { omega = sc.set.omega; sliderW.value = omega; }
      }
    }
  });

  const cList = shell.controlsContainer;
  cList.innerHTML = `
    <div class="ctrl-group">
      <div class="ctrl-top"><span class="ctrl-label">Cảm ứng từ B:</span><span class="ctrl-num" id="valB">${formatViNum(B, 1)} T</span></div>
      <input type="range" class="sim-slider" id="slB" min="0.1" max="1.0" step="0.05" value="${B}">
    </div>
    <div class="ctrl-group">
      <div class="ctrl-top"><span class="ctrl-label">Chế độ vận hành:</span></div>
      <button type="button" class="btn" id="btnMode" style="padding:6px;font-size:11px;">Chế độ: Tự quay</button>
    </div>
    <div class="ctrl-group" id="grpA">
      <div class="ctrl-top"><span class="ctrl-label">Góc α (thủ công):</span><span class="ctrl-num" id="valA">${alphaDeg}°</span></div>
      <input type="range" class="sim-slider" id="slA" min="0" max="180" step="1" value="${alphaDeg}">
    </div>
    <div class="ctrl-group" id="grpW">
      <div class="ctrl-top"><span class="ctrl-label">Tốc độ quay ω:</span><span class="ctrl-num" id="valW">${omega} rad/s</span></div>
      <input type="range" class="sim-slider" id="slW" min="1" max="20" step="1" value="${omega}">
    </div>
  `;

  const sliderB = cList.querySelector('#slB');
  const btnMode = cList.querySelector('#btnMode');
  const sliderA = cList.querySelector('#slA');
  const sliderW = cList.querySelector('#slW');
  const dispB = cList.querySelector('#valB');
  const dispA = cList.querySelector('#valA');
  const dispW = cList.querySelector('#valW');

  sliderB.addEventListener('input', () => {
    B = parseFloat(sliderB.value);
    dispB.textContent = `${formatViNum(B, 1)} T`;
    shell.onUserInteract();
    if (window.AudioEngine) AudioEngine.playTick();
  });

  btnMode.addEventListener('click', () => {
    isAutoRotate = !isAutoRotate;
    btnMode.textContent = isAutoRotate ? 'Chế độ: Tự quay' : 'Chế độ: Thủ công';
    shell.onUserInteract();
    if (window.AudioEngine) AudioEngine.playClick();
  });

  sliderA.addEventListener('input', () => {
    alphaDeg = parseFloat(sliderA.value);
    dispA.textContent = `${alphaDeg}°`;
    shell.onUserInteract();
    if (window.AudioEngine) AudioEngine.playTick();
  });

  sliderW.addEventListener('input', () => {
    omega = parseFloat(sliderW.value);
    dispW.textContent = `${omega} rad/s`;
    shell.onUserInteract();
    if (window.AudioEngine) AudioEngine.playTick();
  });

  let rAF = null;
  let tSim = 0;
  const phiTrace = [];
  const ecTrace = [];

  function update() {
    if (!shell.isPaused) {
      tSim += 0.025;
      if (isAutoRotate) {
        alphaDeg = ((tSim * omega * (180 / Math.PI)) % 360);
      }
      const alphaRad = (alphaDeg * Math.PI) / 180;
      const Phi_Wb = B * S * Math.cos(alphaRad);
      const Phi_mWb = Phi_Wb * 1000;
      const ec_V = isAutoRotate ? (B * S * omega * Math.sin(alphaRad)) : 0;

      shell.updateReadout('alpha', `${Math.round(alphaDeg)}°`);
      shell.updateReadout('B', `${formatViNum(B, 2)} T`);
      shell.updateReadout('Phi', `${formatViNum(Phi_mWb, 1)} mWb (${formatSciVi(Phi_Wb, 'Wb')})`);
      shell.updateReadout('ec', `${formatViNum(ec_V, 2)} V`);

      // Oscilloscope traces
      phiTrace.push({ x: tSim, y: Phi_mWb });
      ecTrace.push({ x: tSim, y: ec_V * 20 });
      if (phiTrace.length > 60) phiTrace.shift();
      if (ecTrace.length > 60) ecTrace.shift();

      shell.plot.setDomain(Math.max(0, tSim - 3.5), tSim + 0.5, -30, 30);
      shell.plot.setLiveSeries(phiTrace, ecTrace);
      shell.plot.setMarker({ x: tSim, y: Phi_mWb, label: `Φ: ${formatViNum(Phi_mWb, 1)} mWb` });

      shell.g3d.clearPrimitives();

      // Uniform B-field arrows
      for (let gx = -1.6; gx <= 1.6; gx += 0.8) {
        for (let gz = -1.6; gz <= 1.6; gz += 0.8) {
          shell.g3d.addArrow(Geo3D.v3(gx, -1.8, gz), Geo3D.v3(gx, 1.8, gz), 'rgba(53,224,255,0.22)', 0.15);
        }
      }

      // Rotating loop rectangle
      const cosA = Math.cos(alphaRad);
      const sinA = Math.sin(alphaRad);
      const loopW = 1.2, loopH = 1.2;

      // Loop corners rotated around X axis
      const c1 = Geo3D.v3(-loopW, -loopH * cosA, loopH * sinA);
      const c2 = Geo3D.v3(loopW, -loopH * cosA, loopH * sinA);
      const c3 = Geo3D.v3(loopW, loopH * cosA, -loopH * sinA);
      const c4 = Geo3D.v3(-loopW, loopH * cosA, -loopH * sinA);

      shell.g3d.addLine(c1, c2, accentColor, 3, true);
      shell.g3d.addLine(c2, c3, accentColor, 3, true);
      shell.g3d.addLine(c3, c4, accentColor, 3, true);
      shell.g3d.addLine(c4, c1, accentColor, 3, true);

      // Normal vector n
      const nLen = 1.4;
      const nVec = Geo3D.v3(0, nLen * sinA, nLen * cosA);
      shell.g3d.addArrow(Geo3D.v3(0, 0, 0), nVec, '#FF8A00', 0.3, 'n');

      // Highlighted magnetic field lines piercing the loop
      if (Math.abs(cosA) > 0.1) {
        shell.g3d.addArrow(Geo3D.v3(0, -1.8, 0), Geo3D.v3(0, 1.8, 0), '#00F5A0', 0.25, 'B_flux');
      }
    }

    shell.g3d.render();
    shell.plot.render();
    rAF = requestAnimationFrame(update);
  }

  shell.g3d.resize();
  shell.plot.resize();
  rAF = requestAnimationFrame(update);

  return {
    destroy() {
      if (rAF) cancelAnimationFrame(rAF);
      shell.destroy();
    }
  };
};

/* ==========================================================================
   SIMULATION 8: SIMS.nucleusBuilder (sec-4.1.1)
   ========================================================================== */
SIMS.nucleusBuilder = function(container, options = {}) {
  const accentColor = '#B347FF';
  const secId = 'sec-4.1.1';
  let Z = 26; // Protons (Fe-56)
  let A = 56; // Mass number

  // Lookup table of known binding energies (MeV)
  const B_TABLE = {
    '1-2': 2.224, '1-3': 8.482, '2-3': 7.718, '2-4': 28.296,
    '3-6': 31.994, '3-7': 39.245, '4-9': 58.165, '6-12': 92.162,
    '7-14': 104.659, '8-16': 127.619, '10-20': 160.645, '12-24': 198.257,
    '14-28': 236.537, '20-40': 342.052, '26-56': 492.254, '28-62': 545.259,
    '82-208': 1636.43, '92-235': 1783.87, '92-238': 1801.69
  };

  function getBindingEnergy(z, a) {
    const key = `${z}-${a}`;
    if (B_TABLE[key]) return B_TABLE[key];
    // Bethe-Weizsäcker Semi-Empirical Mass Formula (SEMF)
    const n = a - z;
    if (n < 0 || a < 1) return 0;
    let delta = 0;
    if (z % 2 === 0 && n % 2 === 0) delta = 11.18 / Math.sqrt(a);
    else if (z % 2 !== 0 && n % 2 !== 0) delta = -11.18 / Math.sqrt(a);
    const B_est = 15.75 * a - 17.8 * Math.pow(a, 2/3) - 0.711 * (z * (z - 1)) / Math.pow(a, 1/3) - 23.7 * Math.pow(a - 2 * z, 2) / a + delta;
    return Math.max(0, B_est);
  }

  const presets = [
    { label: "Heli-4 (⁴₂He · ε = 7,07)", Z: 2, A: 4 },
    { label: "Cacbon-12 (¹²₆C · ε = 7,68)", Z: 6, A: 12 },
    { label: "Sắt-56 (⁵⁶₂₆Fe · ε = 8,79 cực đại)", Z: 26, A: 56 },
    { label: "Urani-235 (²³⁵₉₂U · Phân hạch)", Z: 92, A: 235 }
  ];

  const readouts = {
    nuclide: { label: 'Kí hiệu hạt nhân' },
    ZN: { label: 'Số hạt (Z, N)' },
    deltaM: { label: 'Độ hụt khối Δm' },
    W_lk: { label: 'Năng lượng liên kết W_lk' },
    eps: { label: 'Năng lượng liên kết riêng ε' }
  };

  const challenges = [
    {
      q: "Hạt nhân nào sau đây có năng lượng liên kết riêng lớn nhất (bền vững nhất trong tự nhiên)?",
      choices: ["Sắt ⁵⁶₂₆Fe (≈ 8,79 MeV/nucleon)", "Hêli ⁴₂He (≈ 7,07 MeV/nucleon)", "Urani ²³⁵₉₂U (≈ 7,59 MeV/nucleon)"],
      answer: 0,
      scenario: { set: { Z: 26, A: 56 } },
      explain: "Hạt nhân sắt ⁵⁶₂₆Fe và niken ⁶²₂₈Ni nằm ở đỉnh đường cong năng lượng liên kết riêng (ε ≈ 8,8 MeV/nucl) nên bền vững nhất."
    },
    {
      q: "Đại lượng vật lí nào đặc trưng chính xác nhất cho mức độ bền vững của một hạt nhân nguyên tử?",
      choices: ["Năng lượng liên kết riêng ε = W_lk / A", "Năng lượng liên kết toàn phần W_lk", "Độ hụt khối Δm"],
      answer: 0,
      scenario: { set: { Z: 2, A: 4 } },
      explain: "Năng lượng liên kết riêng tính trên một nuclôn (ε = W_lk/A) là đại lượng đặc trưng cho độ bền vững của hạt nhân."
    }
  ];

  const shell = createSimShell(container, {
    secId,
    accentColor,
    plotTitle: 'Đường cong năng lượng liên kết riêng ε theo số khối A',
    plotXLabel: 'A (Số khối)',
    plotYLabel: 'ε (MeV/nucl)',
    plotConfig: { xMin: 0, xMax: 240, yMin: 0, yMax: 10 },
    presets,
    readouts,
    challenges,
    onApplyPreset: (pr) => {
      if (pr.Z) { Z = pr.Z; sliderZ.value = Z; }
      if (pr.A) { A = pr.A; sliderA.value = A; }
    },
    onRunChallengeScenario: (sc) => {
      if (sc.set) {
        if (sc.set.Z) { Z = sc.set.Z; sliderZ.value = Z; }
        if (sc.set.A) { A = sc.set.A; sliderA.value = A; }
      }
    }
  });

  const cList = shell.controlsContainer;
  cList.innerHTML = `
    <div class="ctrl-group">
      <div class="ctrl-top"><span class="ctrl-label">Số proton Z:</span><span class="ctrl-num" id="valZ">${Z}</span></div>
      <input type="range" class="sim-slider" id="slZ" min="1" max="92" step="1" value="${Z}">
    </div>
    <div class="ctrl-group">
      <div class="ctrl-top"><span class="ctrl-label">Số khối A:</span><span class="ctrl-num" id="valA">${A}</span></div>
      <input type="range" class="sim-slider" id="slA" min="1" max="240" step="1" value="${A}">
    </div>
  `;

  const sliderZ = cList.querySelector('#slZ');
  const sliderA = cList.querySelector('#slA');
  const dispZ = cList.querySelector('#valZ');
  const dispA = cList.querySelector('#valA');

  sliderZ.addEventListener('input', () => {
    Z = parseInt(sliderZ.value, 10);
    if (A < Z) { A = Z; sliderA.value = A; }
    dispZ.textContent = `${Z}`;
    dispA.textContent = `${A}`;
    shell.onUserInteract();
    if (window.AudioEngine) AudioEngine.playTick();
  });

  sliderA.addEventListener('input', () => {
    A = parseInt(sliderA.value, 10);
    if (A < Z) { Z = A; sliderZ.value = Z; }
    dispZ.textContent = `${Z}`;
    dispA.textContent = `${A}`;
    shell.onUserInteract();
    if (window.AudioEngine) AudioEngine.playTick();
  });

  // Reference nuclides on binding curve
  const refNuclides = [
    { a: 2, eps: 1.11 }, { a: 4, eps: 7.07 }, { a: 12, eps: 7.68 },
    { a: 16, eps: 7.98 }, { a: 56, eps: 8.79 }, { a: 62, eps: 8.79 },
    { a: 100, eps: 8.6 }, { a: 208, eps: 7.87 }, { a: 235, eps: 7.59 }
  ];
  shell.plot.setStaticPoints(refNuclides.map(n => ({ x: n.a, y: n.eps })));
  shell.plot.setStaticCurve((a) => {
    if (a < 2) return 0;
    if (a < 12) return 1.1 + Math.log(a) * 2.5;
    return 8.8 - Math.pow(a - 60, 2) * 0.000045 - (a > 60 ? (a - 60) * 0.0065 : 0);
  });

  // Deterministic Fibonacci spherical shell packing for nucleons
  function getNucleonPosition(index) {
    const phi = Math.acos(1 - 2 * (index + 0.5) / 260);
    const goldenRatio = (1 + Math.sqrt(5)) / 2;
    const theta = 2 * Math.PI * index / goldenRatio;
    const rShell = 0.35 * Math.pow(index + 1, 1/3);
    return Geo3D.v3(
      rShell * Math.sin(phi) * Math.cos(theta),
      rShell * Math.sin(phi) * Math.sin(theta),
      rShell * Math.cos(phi)
    );
  }

  let rAF = null;
  function update() {
    if (!shell.isPaused) {
      const N_neutrons = Math.max(0, A - Z);
      const W_lk = getBindingEnergy(Z, A);
      const deltaM_u = W_lk / 931.5;
      const eps = A > 0 ? (W_lk / A) : 0;

      shell.updateReadout('nuclide', `Hạt nhân (Z = ${Z}, A = ${A})`);
      shell.updateReadout('ZN', `${Z} Proton + ${N_neutrons} Nơtron`);
      shell.updateReadout('deltaM', `${formatViNum(deltaM_u, 4)} u`);
      shell.updateReadout('W_lk', `${formatViNum(W_lk, 2)} MeV`);
      shell.updateReadout('eps', `${formatViNum(eps, 2)} MeV/nucl`);

      shell.plot.setMarker({ x: A, y: eps, label: `A=${A}, ε=${formatViNum(eps, 2)}` });

      shell.g3d.clearPrimitives();

      // Render nucleons
      const numToShow = Math.min(240, A);
      const protonStep = numToShow / Math.max(1, Z);

      for (let i = 0; i < numToShow; i++) {
        const isProton = (Math.floor(i / protonStep) < Z);
        const col = isProton ? '#FF2D55' : '#007AFF'; // Ruby-red proton, Sapphire-blue neutron
        const pos = getNucleonPosition(i);
        shell.g3d.addSphere(pos, 0.22, col, true);
      }
    }

    shell.g3d.render();
    shell.plot.render();
    rAF = requestAnimationFrame(update);
  }

  shell.g3d.resize();
  shell.plot.resize();
  rAF = requestAnimationFrame(update);

  return {
    destroy() {
      if (rAF) cancelAnimationFrame(rAF);
      shell.destroy();
    }
  };
};

/* ==========================================================================
   SIMULATION 9: SIMS.decayCloud (sec-4.2.1)
   ========================================================================== */
SIMS.decayCloud = function(container, options = {}) {
  const accentColor = '#B347FF';
  const secId = 'sec-4.2.1';
  let T_half = 5.0; // s (1 to 20 s)
  let timeSpeed = 1.0;
  const N0 = 1000;
  let remainingN = N0;
  let elapsedT = 0;

  const presets = [
    { label: "Quan sát 1 chu kì (t = 1T · 50% còn lại)", targetT: 1 },
    { label: "Quan sát 2 chu kì (t = 2T · 25% còn lại)", targetT: 2 },
    { label: "Quan sát 3 chu kì (t = 3T · 12,5% còn lại)", targetT: 3 }
  ];

  const readouts = {
    t: { label: 'Thời gian trôi qua t' },
    N_t: { label: 'Số hạt còn lại N(t)' },
    pct: { label: 'Tỉ lệ phần trăm N/N₀' },
    lambda: { label: 'Hằng số phóng xạ λ = ln2/T' },
    H: { label: 'Độ phóng xạ H = λ·N' }
  };

  const challenges = [
    {
      q: "Sau khoảng thời gian bằng 3 chu kì bán rã (t = 3T), tỉ lệ phần trăm số hạt nhân phóng xạ còn lại chưa bị phân rã là:",
      choices: ["12,5% (bằng 1/8)", "25% (bằng 1/4)", "6,25% (bằng 1/16)"],
      answer: 0,
      scenario: { set: { targetT: 3 } },
      explain: "Theo định luật phóng xạ: N(t) = N₀·2^(-t/T). Với t = 3T ⇒ N = N₀·2^(-3) = N₀ / 8 = 12,5%."
    },
    {
      q: "Hằng số phóng xạ λ có mối liên hệ với chu kì bán rã T theo biểu thức nào?",
      choices: ["λ = (ln 2) / T", "λ = T / (ln 2)", "λ = T · ln 2"],
      answer: 0,
      scenario: { set: { T: 5 } },
      explain: "Vì 2^(-t/T) = e^(-λt) nên hằng số phóng xạ λ = (ln 2) / T ≈ 0,693 / T."
    }
  ];

  const shell = createSimShell(container, {
    secId,
    accentColor,
    plotTitle: 'Định luật phân rã phóng xạ N(t) = N₀·2^(-t/T)',
    plotXLabel: 't / T',
    plotYLabel: 'N / N₀ (%)',
    plotConfig: { xMin: 0, xMax: 4.0, yMin: 0, yMax: 100 },
    presets,
    readouts,
    challenges,
    onApplyPreset: (pr) => {
      elapsedT = pr.targetT * T_half;
      recalcDecay();
    },
    onRunChallengeScenario: (sc) => {
      if (sc.set && sc.set.targetT) {
        elapsedT = sc.set.targetT * T_half;
        recalcDecay();
      }
    }
  });

  const cList = shell.controlsContainer;
  cList.innerHTML = `
    <div class="ctrl-group">
      <div class="ctrl-top"><span class="ctrl-label">Chu kì bán rã T:</span><span class="ctrl-num" id="valT">${T_half} s</span></div>
      <input type="range" class="sim-slider" id="slT" min="1" max="20" step="0.5" value="${T_half}">
    </div>
    <div class="ctrl-group">
      <div class="ctrl-top"><span class="ctrl-label">Tốc độ mô phỏng:</span><span class="ctrl-num" id="valSp">${timeSpeed}x</span></div>
      <input type="range" class="sim-slider" id="slSp" min="0.25" max="4.0" step="0.25" value="${timeSpeed}">
    </div>
    <button type="button" class="btn" id="btnRestartDecay" style="margin-top:6px;padding:6px;font-size:11px;">↺ Tái thiết lập ban đầu (t = 0)</button>
  `;

  const sliderT = cList.querySelector('#slT');
  const sliderSp = cList.querySelector('#slSp');
  const btnRestart = cList.querySelector('#btnRestartDecay');
  const dispT = cList.querySelector('#valT');
  const dispSp = cList.querySelector('#valSp');

  sliderT.addEventListener('input', () => {
    T_half = parseFloat(sliderT.value);
    dispT.textContent = `${T_half} s`;
    shell.onUserInteract();
    if (window.AudioEngine) AudioEngine.playTick();
  });

  sliderSp.addEventListener('input', () => {
    timeSpeed = parseFloat(sliderSp.value);
    dispSp.textContent = `${timeSpeed}x`;
    shell.onUserInteract();
    if (window.AudioEngine) AudioEngine.playTick();
  });

  btnRestart.addEventListener('click', () => {
    elapsedT = 0;
    recalcDecay();
    shell.onUserInteract();
    if (window.AudioEngine) AudioEngine.playClick();
  });

  // 10x10x10 lattice of 1000 nuclei
  const lattice = [];
  const latSpan = 2.4;
  for (let x = 0; x < 10; x++) {
    for (let y = 0; y < 10; y++) {
      for (let z = 0; z < 10; z++) {
        lattice.push({
          px: -latSpan * 0.5 + (x / 9) * latSpan,
          py: -latSpan * 0.5 + (y / 9) * latSpan,
          pz: -latSpan * 0.5 + (z / 9) * latSpan,
          decayProb: Math.random(),
          decayed: false
        });
      }
    }
  }

  function recalcDecay() {
    const fractionDecayed = 1.0 - Math.pow(2, -elapsedT / T_half);
    let count = 0;
    lattice.forEach(n => {
      n.decayed = (n.decayProb < fractionDecayed);
      if (!n.decayed) count++;
    });
    remainingN = count;
  }

  // Theoretical decay curve
  shell.plot.setStaticCurve((tNorm) => 100 * Math.pow(2, -tNorm));

  let rAF = null;
  const decayHistory = [];

  function update() {
    if (!shell.isPaused) {
      elapsedT += 0.02 * timeSpeed;
      recalcDecay();

      const tNorm = elapsedT / T_half;
      const pct = (remainingN / N0) * 100;
      const lambda = Math.LN2 / T_half;
      const activity = lambda * remainingN;

      shell.updateReadout('t', `${formatViNum(elapsedT, 1)} s (${formatViNum(tNorm, 1)} T)`);
      shell.updateReadout('N_t', `${remainingN} / ${N0} hạt`);
      shell.updateReadout('pct', `${formatViNum(pct, 1)}%`);
      shell.updateReadout('lambda', `${formatViNum(lambda, 3)} s⁻¹`);
      shell.updateReadout('H', `${formatViNum(activity, 1)} Bq`);

      decayHistory.push({ x: tNorm, y: pct });
      if (decayHistory.length > 50) decayHistory.shift();

      shell.plot.setLiveSeries(decayHistory);
      shell.plot.setMarker({ x: tNorm, y: pct, label: `${Math.round(pct)}%` });

      shell.g3d.clearPrimitives();

      // Draw lattice nuclei
      lattice.forEach(n => {
        if (!n.decayed) {
          shell.g3d.addSphere(Geo3D.v3(n.px, n.py, n.pz), 0.08, accentColor);
        } else {
          // Dim decayed daughter
          shell.g3d.addPoint(Geo3D.v3(n.px, n.py, n.pz), 'rgba(100,116,139,0.3)', 2, false);
        }
      });
    }

    shell.g3d.render();
    shell.plot.render();
    rAF = requestAnimationFrame(update);
  }

  shell.g3d.resize();
  shell.plot.resize();
  rAF = requestAnimationFrame(update);

  return {
    destroy() {
      if (rAF) cancelAnimationFrame(rAF);
      shell.destroy();
    }
  };
};
