/* ==========================================================================
   2. PILLAR 2: DEEP COSMIC CANVAS
   - 420+ Stars across 3 Parallax Layers with Color Temperatures & Glints
   - Volumetric Milky Way Dust Band
   - Deep Space Black Hole with Relativistic Doppler Beamed Accretion Disk & Lensing
   - 4 Dynamic Thematic Celestial Environments per Topic (1200ms Lerp)
   ========================================================================== */
const World = (function() {
  const canvas = document.getElementById('bgCanvas');
  const ctx = canvas.getContext('2d');

  // 420 Stars across 3 Parallax Layers
  const numStars = 420;
  const stars = [];
  const STAR_PALETTES = [
    'rgba(215, 235, 255,', // Blue-white (45%)
    'rgba(255, 255, 255,', // Pure white (35%)
    'rgba(255, 210, 150,', // Warm amber (12%)
    'rgba(255, 130, 110,'  // Red dwarf (8%)
  ];

  for (let i = 0; i < numStars; i++) {
    const pRand = Math.random();
    let colPrefix = STAR_PALETTES[0];
    if (pRand > 0.45 && pRand <= 0.80) colPrefix = STAR_PALETTES[1];
    else if (pRand > 0.80 && pRand <= 0.92) colPrefix = STAR_PALETTES[2];
    else if (pRand > 0.92) colPrefix = STAR_PALETTES[3];

    const sizePow = Math.pow(Math.random(), 3);
    const size = 0.4 + sizePow * 2.8;

    stars.push({
      x: Math.random(),
      y: Math.random(),
      layer: Math.floor(Math.random() * 3), // 0, 1, 2
      size: size,
      colPrefix: colPrefix,
      alpha: Math.random() * 0.7 + 0.3,
      twinkleSpeed: Math.random() * 0.035 + 0.01,
      phase: Math.random() * Math.PI * 2,
      hasGlint: size >= 2.0
    });
  }

  // Mid-distance Drifting Nebula Sprites
  const nebulae = [
    { x: 0.25, y: 0.35, vx: 0.00006, vy: 0.00003, rad: 380, col: 'rgba(255,138,0,0.12)' },
    { x: 0.75, y: 0.30, vx: -0.00005, vy: 0.00004, rad: 420, col: 'rgba(0,245,160,0.10)' },
    { x: 0.45, y: 0.70, vx: 0.00006, vy: -0.00005, rad: 460, col: 'rgba(0,229,255,0.12)' },
    { x: 0.80, y: 0.75, vx: -0.00004, vy: -0.00003, rad: 400, col: 'rgba(179,71,255,0.14)' }
  ];

  // Sporadic Shooting Stars
  const shootingStars = [];
  function spawnShootingStar() {
    if (Math.random() < 0.015 && shootingStars.length < 2) {
      shootingStars.push({
        x: Math.random() * 0.8 + 0.1,
        y: Math.random() * 0.4,
        len: Math.random() * 120 + 80,
        speed: Math.random() * 0.015 + 0.01,
        angle: Math.PI / 4 + (Math.random() - 0.5) * 0.2,
        life: 1.0,
        decay: Math.random() * 0.02 + 0.015
      });
    }
  }

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(window.innerWidth * dpr);
    canvas.height = Math.round(window.innerHeight * dpr);
  }

  window.addEventListener('resize', resize);
  resize();

  let bloomPhase = 0;
  const TOPIC_RGB = {
    'topic-01': { r: 255, g: 138, b: 0 },
    'topic-02': { r: 0, g: 245, b: 160 },
    'topic-03': { r: 0, g: 229, b: 255 },
    'topic-04': { r: 179, g: 71, b: 255 }
  };

  const topicWeights = { 'topic-01': 0, 'topic-02': 0, 'topic-03': 1, 'topic-04': 0 };

  // Volumetric Milky Way Dust Band
  function drawMilkyWay(w, h) {
    ctx.save();
    ctx.translate(w * 0.5, h * 0.5);
    ctx.rotate(-22 * Math.PI / 180);
    const mwGrad = ctx.createRadialGradient(0, 0, 40, 0, 0, w * 0.75);
    mwGrad.addColorStop(0, 'rgba(53, 224, 255, 0.045)');
    mwGrad.addColorStop(0.35, 'rgba(168, 85, 247, 0.035)');
    mwGrad.addColorStop(0.7, 'rgba(255, 138, 0, 0.02)');
    mwGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = mwGrad;
    ctx.scale(2.4, 0.45);
    ctx.beginPath();
    ctx.arc(0, 0, w * 0.7, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Deep Space Black Hole with Relativistic Doppler Beaming
  function drawBlackHole(cx, cy, radius) {
    ctx.save();
    // Upper gravitational lensing arc
    ctx.beginPath();
    ctx.ellipse(cx, cy - radius * 0.38, radius * 1.65, radius * 0.52, 0, Math.PI, Math.PI * 2);
    ctx.strokeStyle = 'rgba(53, 224, 255, 0.26)';
    ctx.lineWidth = 2.8;
    ctx.stroke();

    // Accretion disk with relativistic Doppler beaming
    const diskGrad = ctx.createLinearGradient(cx - radius * 2.1, cy, cx + radius * 2.1, cy);
    diskGrad.addColorStop(0, 'rgba(53, 224, 255, 0.65)');     // Approaching (Doppler blue-shifted)
    diskGrad.addColorStop(0.35, 'rgba(255, 255, 255, 0.85)'); // Relativistic brightness peak
    diskGrad.addColorStop(0.5, 'rgba(255, 138, 0, 0.35)');
    diskGrad.addColorStop(1, 'rgba(255, 70, 0, 0.12)');      // Receding (dimmer red-shifted)

    ctx.beginPath();
    ctx.ellipse(cx, cy, radius * 2.1, radius * 0.42, 0.1, 0, Math.PI * 2);
    ctx.strokeStyle = diskGrad;
    ctx.lineWidth = 6;
    ctx.stroke();

    // Lower gravitational lensing arc
    ctx.beginPath();
    ctx.ellipse(cx, cy + radius * 0.38, radius * 1.45, radius * 0.38, 0, 0, Math.PI);
    ctx.strokeStyle = 'rgba(168, 85, 247, 0.20)';
    ctx.lineWidth = 2.4;
    ctx.stroke();

    // Photon ring (razor sharp bright inner ring)
    ctx.beginPath();
    ctx.arc(cx, cy, radius * 1.05, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
    ctx.lineWidth = 1.4;
    ctx.shadowColor = '#35E0FF';
    ctx.shadowBlur = 8;
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Dark event horizon sphere shadow
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.fillStyle = '#010207';
    ctx.fill();

    ctx.restore();
  }

  function render() {
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.width / dpr;
    const h = canvas.height / dpr;
    if (w <= 10 || h <= 10) return;

    ctx.save();
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, w, h);

    // Deep cosmic gradient
    const bgGrad = ctx.createRadialGradient(w * 0.5, h * 0.4, 0, w * 0.5, h * 0.4, w * 0.8);
    bgGrad.addColorStop(0, '#061129');
    bgGrad.addColorStop(0.65, '#030714');
    bgGrad.addColorStop(1.0, '#010207');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, w, h);

    // Lerp tint color toward active topic
    const targetRGB = TOPIC_RGB[appState.targetTopicId] || TOPIC_RGB['topic-03'];
    appState.currentTint.r += (targetRGB.r - appState.currentTint.r) * 0.04;
    appState.currentTint.g += (targetRGB.g - appState.currentTint.g) * 0.04;
    appState.currentTint.b += (targetRGB.b - appState.currentTint.b) * 0.04;

    // Smoothly lerp 4 thematic celestial environments (~1200ms)
    for (const tId in topicWeights) {
      const target = (appState.targetTopicId === tId) ? 1.0 : 0.0;
      topicWeights[tId] += (target - topicWeights[tId]) * 0.035;
    }

    // Volumetric Milky Way Band
    drawMilkyWay(w, h);

    // Mid-distance Drifting Nebula Sprites
    nebulae.forEach(n => {
      n.x += n.vx; n.y += n.vy;
      if (n.x < -0.2) n.x = 1.2; if (n.x > 1.2) n.x = -0.2;
      if (n.y < -0.2) n.y = 1.2; if (n.y > 1.2) n.y = -0.2;

      const nx = n.x * w;
      const ny = n.y * h;
      const nGrad = ctx.createRadialGradient(nx, ny, 0, nx, ny, n.rad * appState.worldZoom);
      nGrad.addColorStop(0, n.col);
      nGrad.addColorStop(1, 'rgba(3,7,20,0)');
      ctx.fillStyle = nGrad;
      ctx.beginPath();
      ctx.arc(nx, ny, n.rad * appState.worldZoom, 0, Math.PI * 2);
      ctx.fill();
    });

    // 4 Thematic Celestial Environments
    // 1. Topic 1: Solar plasma surface & coronal prominence flares
    if (topicWeights['topic-01'] > 0.01) {
      const w1 = topicWeights['topic-01'];
      ctx.save();
      ctx.globalAlpha = w1 * 0.35;
      for (let i = 0; i < 4; i++) {
        const ang = bloomPhase * 0.8 + i * (Math.PI / 2);
        const fx = w * 0.5 + Math.cos(ang) * 380;
        const fy = h * 0.5 + Math.sin(ang) * 220;
        const fGrad = ctx.createRadialGradient(fx, fy, 0, fx, fy, 160);
        fGrad.addColorStop(0, 'rgba(255, 138, 0, 0.45)');
        fGrad.addColorStop(0.5, 'rgba(255, 70, 0, 0.15)');
        fGrad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = fGrad;
        ctx.beginPath();
        ctx.arc(fx, fy, 160, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    // 2. Topic 2: Emerald cold gas nebula with molecular filaments
    if (topicWeights['topic-02'] > 0.01) {
      const w2 = topicWeights['topic-02'];
      ctx.save();
      ctx.globalAlpha = w2 * 0.32;
      for (let i = 0; i < 3; i++) {
        const nx = w * (0.3 + i * 0.25) + Math.sin(bloomPhase * 0.5 + i) * 60;
        const ny = h * (0.35 + i * 0.15) + Math.cos(bloomPhase * 0.4 + i) * 40;
        const nGrad = ctx.createRadialGradient(nx, ny, 10, nx, ny, 320);
        nGrad.addColorStop(0, 'rgba(0, 245, 160, 0.35)');
        nGrad.addColorStop(0.6, 'rgba(0, 160, 120, 0.12)');
        nGrad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = nGrad;
        ctx.beginPath();
        ctx.arc(nx, ny, 320, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    // 3. Topic 3: Pulsar / magnetar dual relativistic polar jets & field loops
    if (topicWeights['topic-03'] > 0.01) {
      const w3 = topicWeights['topic-03'];
      ctx.save();
      ctx.globalAlpha = w3 * 0.35;
      const jetGrad = ctx.createLinearGradient(w * 0.5, 0, w * 0.5, h);
      jetGrad.addColorStop(0, 'rgba(0, 229, 255, 0.22)');
      jetGrad.addColorStop(0.5, 'rgba(0, 229, 255, 0.02)');
      jetGrad.addColorStop(1, 'rgba(0, 229, 255, 0.22)');
      ctx.fillStyle = jetGrad;
      ctx.fillRect(w * 0.485, 0, w * 0.03, h);
      ctx.restore();
    }

    // 4. Topic 4: Supernova remnant violet shockwave shells
    if (topicWeights['topic-04'] > 0.01) {
      const w4 = topicWeights['topic-04'];
      ctx.save();
      ctx.globalAlpha = w4 * 0.35;
      const sGrad = ctx.createRadialGradient(w * 0.5, h * 0.5, 120, w * 0.5, h * 0.5, 480);
      sGrad.addColorStop(0, 'rgba(179, 71, 255, 0.25)');
      sGrad.addColorStop(0.5, 'rgba(120, 40, 220, 0.15)');
      sGrad.addColorStop(0.8, 'rgba(80, 20, 160, 0.05)');
      sGrad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = sGrad;
      ctx.beginPath();
      ctx.arc(w * 0.5, h * 0.5, 480, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // Deep space Black Hole (offset celestial feature in cosmos)
    drawBlackHole(w * 0.5, h * 0.5, 46 * appState.worldZoom);

    // Ambient Bloom behind Orbit Ellipse & Sun Core (~6s cycle)
    bloomPhase += 0.015;
    const bloomScale = 1.0 + Math.sin(bloomPhase) * 0.05;
    const bloomAlpha = 0.25 + Math.sin(bloomPhase) * 0.08;
    const { r, g, b } = appState.currentTint;

    const bGrad = ctx.createRadialGradient(w * 0.5, h * 0.5, 0, w * 0.5, h * 0.5, 420 * bloomScale * appState.worldZoom);
    bGrad.addColorStop(0, `rgba(${Math.round(r)},${Math.round(g)},${Math.round(b)},${bloomAlpha})`);
    bGrad.addColorStop(0.5, `rgba(${Math.round(r)},${Math.round(g)},${Math.round(b)},${bloomAlpha * 0.3})`);
    bGrad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = bGrad;
    ctx.beginPath();
    ctx.arc(w * 0.5, h * 0.5, 420 * bloomScale * appState.worldZoom, 0, Math.PI * 2);
    ctx.fill();

    // 420 Stars across 3 parallax layers with diffraction glints
    stars.forEach(s => {
      s.phase += s.twinkleSpeed;
      const alpha = s.alpha * (0.6 + 0.4 * Math.sin(s.phase));
      const sx = s.x * w;
      const sy = s.y * h;

      ctx.fillStyle = `${s.colPrefix}${alpha})`;
      ctx.beginPath();
      ctx.arc(sx, sy, s.size, 0, Math.PI * 2);
      ctx.fill();

      // 4-point cross diffraction glints on brightest stars
      if (s.hasGlint && alpha > 0.65) {
        const rayLen = s.size * 3.5;
        ctx.strokeStyle = `${s.colPrefix}${alpha * 0.65})`;
        ctx.lineWidth = 0.8;
        ctx.beginPath();
        ctx.moveTo(sx - rayLen, sy);
        ctx.lineTo(sx + rayLen, sy);
        ctx.moveTo(sx, sy - rayLen);
        ctx.lineTo(sx, sy + rayLen);
        ctx.stroke();
      }
    });

    // Shooting Stars
    spawnShootingStar();
    for (let i = shootingStars.length - 1; i >= 0; i--) {
      const m = shootingStars[i];
      m.x += Math.cos(m.angle) * m.speed;
      m.y += Math.sin(m.angle) * m.speed;
      m.life -= m.decay;

      const sx = m.x * w;
      const sy = m.y * h;
      const tx = sx - Math.cos(m.angle) * m.len;
      const ty = sy - Math.sin(m.angle) * m.len;

      const sGrad = ctx.createLinearGradient(sx, sy, tx, ty);
      sGrad.addColorStop(0, `rgba(255,255,255,${m.life})`);
      sGrad.addColorStop(0.3, `rgba(53,224,255,${m.life * 0.8})`);
      sGrad.addColorStop(1, 'rgba(53,224,255,0)');

      ctx.strokeStyle = sGrad;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(tx, ty);
      ctx.stroke();

      if (m.life <= 0) shootingStars.splice(i, 1);
    }

    ctx.restore();
    requestAnimationFrame(render);
  }

  requestAnimationFrame(render);

  return { resize };
})();

/* ==========================================================================
   3. RENDER ENGINE (SCENES 1 TO 5)

const stageEl = document.getElementById('stage');

        <div class="orbit-cards-layer" id="orbitCardsLayer"></div>
      </div>
    `;

    // Populate Sun Core Formulas
    const FORMULAS_DATA = [
      { topic: 'topic-01', name: 'Định luật 1 NĐLH', expr: 'ΔU = A + Q', unit: 'J', note: 'Q, A > 0: nhận; Q, A < 0: truyền/thực hiện', secId: 'sec-1.1.2' },
      { topic: 'topic-01', name: 'Nhiệt dung riêng', expr: 'Q = m·c·ΔT', unit: 'J', note: 'c: J/(kg·K), m: kg', secId: 'sec-1.2.1' },
      { topic: 'topic-01', name: 'Nhiệt nóng chảy riêng', expr: 'Q = λ·m', unit: 'J', note: 'λ: J/kg', secId: 'sec-1.2.2' },
      { topic: 'topic-01', name: 'Nhiệt hóa hơi riêng', expr: 'Q = L·m', unit: 'J', note: 'L: J/kg', secId: 'sec-1.2.3' },
      { topic: 'topic-02', name: 'Định luật Boyle', expr: 'p₁·V₁ = p₂·V₂ = const', unit: 'Pa·m³', note: 'Quá trình đẳng nhiệt (T = const)', secId: 'sec-2.1.1' },
      { topic: 'topic-02', name: 'Định luật Charles', expr: 'V₁ / T₁ = V₂ / T₂', unit: 'm³/K', note: 'Quá trình đẳng áp (p = const)', secId: 'sec-2.1.2' },
      { topic: 'topic-02', name: 'Clapeyron - Mendeleev', expr: 'p·V = n·R·T', unit: 'Pa, m³', note: 'R = 8,314 J/(mol·K)', secId: 'sec-2.1.2' },
      { topic: 'topic-02', name: 'Động năng tịnh tiến', expr: 'E_đ = (3/2)·k·T', unit: 'J', note: 'k = 1,38×10⁻²³ J/K', secId: 'sec-2.2.1' },
      { topic: 'topic-03', name: 'Cảm ứng từ dòng thẳng', expr: 'B = 2·10⁻⁷·(I / r)', unit: 'T', note: 'Quy tắc nắm tay phải', secId: 'sec-3.1.1' },
      { topic: 'topic-03', name: 'Lực Laplace', expr: 'F = B·I·L·sinα', unit: 'N', note: 'Quy tắc bàn tay trái', secId: 'sec-3.1.1' },
      { topic: 'topic-03', name: 'Lực Lorentz', expr: 'f = |q|·v·B·sinα', unit: 'N', note: 'Bán kính r = mv·sinα / (|q|B)', secId: 'sec-3.1.2' },
      { topic: 'topic-03', name: 'Từ thông', expr: 'Φ = B·S·cosα', unit: 'Wb', note: 'α = (n, B)', secId: 'sec-3.1.3' },
      { topic: 'topic-03', name: 'Hiện tượng cảm ứng điện từ', expr: 'e_c = -ΔΦ / Δt', unit: 'V', note: 'Định luật Faraday & Lenz', secId: 'sec-3.1.3' },
      { topic: 'topic-04', name: 'Độ hụt khối', expr: 'Δm = Z·m_p + N·m_n - m_X', unit: 'u', note: 'm_p = 1,00728 u; m_n = 1,00866 u', secId: 'sec-4.1.1' },
      { topic: 'topic-04', name: 'Năng lượng liên kết', expr: 'W_lk = Δm·c²', unit: 'MeV', note: '1 u·c² ≈ 931,5 MeV', secId: 'sec-4.1.1' },
      { topic: 'topic-04', name: 'Năng lượng liên kết riêng', expr: 'ε = W_lk / A', unit: 'MeV/nucl', note: 'Đặc trưng cho độ bền vững hạt nhân', secId: 'sec-4.1.1' },
      { topic: 'topic-04', name: 'Định luật phóng xạ', expr: 'N(t) = N₀·2^(-t/T)', unit: 'hạt', note: 'λ = ln2 / T', secId: 'sec-4.2.1' }
    ];

    const coreList = sceneEl.querySelector('#coreFormulaList');
    function renderCoreFormulas(filterTopic = 'all') {

    topics.forEach((top, idx) => {

        triggerPlanetDetach(card, top.id);
      });

      cardsLayer.appendChild(card);
      cardElements.push(card);
    });

    // Orbit Drag Orbit Rotation & Tilt Handling
    const orbitContainer = sceneEl.querySelector('#orbitContainer');
    let orbitPointerStartX = 0, orbitPointerStartY = 0;
    let orbitPointerDownCard = null;
    let hasCapturedPointer = false;

    orbitContainer.addEventListener('pointerdown', (e) => {
      orbitPointerDownCard = e.target.closest('.revolving-planet, .orbit-card');
      orbitPointerStartX = e.clientX;
      orbitPointerStartY = e.clientY;
      isOrbitDragging = true;
      orbitLastX = e.clientX;
      orbitLastY = e.clientY;
      orbitDragDistance = 0;
      hasCapturedPointer = false;
      orbitVelocity = 0;
    });

    orbitContainer.addEventListener('pointermove', (e) => {
      if (!isOrbitDragging) return;
      const dx = e.clientX - orbitLastX;
      const dy = e.clientY - orbitLastY;
      orbitLastX = e.clientX;
      orbitLastY = e.clientY;
      orbitDragDistance += Math.hypot(dx, dy);

      if (orbitDragDistance >= 6 && !hasCapturedPointer) {
        try {
          orbitContainer.setPointerCapture(e.pointerId);
          hasCapturedPointer = true;
        } catch(err) {}
      }

      if (orbitDragDistance >= 3) {
        orbitPhase += dx * 0.003;
        orbitVelocity = dx * 0.003;
        orbitTiltRY = Math.max(CONFIG.orbitMinRY, Math.min(CONFIG.orbitMaxRY, orbitTiltRY + dy * 0.4));
        orbitLastInteraction = performance.now();
      }
    });

    function endOrbitDrag(e) {
      if (isOrbitDragging) {
        isOrbitDragging = false;
        if (hasCapturedPointer) {
          try { orbitContainer.releasePointerCapture(e.pointerId); } catch(err) {}
          hasCapturedPointer = false;
        }

        const moveDist = Math.hypot(e.clientX - orbitPointerStartX, e.clientY - orbitPointerStartY);
        if (moveDist < 6) {
          const card = orbitPointerDownCard ||
                       (e.target && e.target.closest && e.target.closest('.revolving-planet, .orbit-card')) ||
                       (document.elementFromPoint(e.clientX, e.clientY) && document.elementFromPoint(e.clientX, e.clientY).closest('.revolving-planet, .orbit-card'));
          if (card) {
            const targetId = card.dataset.targetId || card.dataset.topicId;
            if (targetId) {
              triggerPlanetDetach(card, targetId);
              return;
            }
          }
        }
      }
      orbitPointerDownCard = null;
    }
    orbitContainer.addEventListener('pointerup', endOrbitDrag);
    orbitContainer.addEventListener('pointercancel', endOrbitDrag);

    // Sun HUD Rings Canvas
    const hudCanvas = sceneEl.querySelector('#sunHudCanvas');
    const hudCtx = hudCanvas.getContext('2d');
    let hudAngle = 0;

    function renderSunHud() {
      hudAngle += 0.006;
      hudCtx.clearRect(0, 0, 640, 640);
      const cx = 320, cy = 320;

      hudCtx.save();
      hudCtx.strokeStyle = 'rgba(53,224,255,0.25)';
      hudCtx.lineWidth = 1;
      hudCtx.beginPath();
      hudCtx.arc(cx, cy, 270, 0, Math.PI * 2);
      hudCtx.stroke();

      for (let deg = 0; deg < 360; deg += 5) {
        const rad = (deg * Math.PI) / 180 + hudAngle;
        const isBold = (deg % 30 === 0);
        const rInner = isBold ? 255 : 263;
        const rOuter = 270;
        hudCtx.strokeStyle = isBold ? 'rgba(53,224,255,0.6)' : 'rgba(53,224,255,0.2)';
        hudCtx.lineWidth = isBold ? 1.5 : 1;
        hudCtx.beginPath();
        hudCtx.moveTo(cx + Math.cos(rad) * rInner, cy + Math.sin(rad) * rInner);
        hudCtx.lineTo(cx + Math.cos(rad) * rOuter, cy + Math.sin(rad) * rOuter);
        hudCtx.stroke();
      }

      hudCtx.strokeStyle = 'rgba(168,85,247,0.22)';
      hudCtx.beginPath();
      hudCtx.arc(cx, cy, 210, 0, Math.PI * 2);
      hudCtx.stroke();

      // Radar sweep wedge
      const sweepRad = -hudAngle * 1.5;
      const grad = hudCtx.createRadialGradient(cx, cy, 0, cx, cy, 270);
      grad.addColorStop(0, 'rgba(53,224,255,0)');
      grad.addColorStop(1, 'rgba(53,224,255,0.08)');
      hudCtx.fillStyle = grad;
      hudCtx.beginPath();
      hudCtx.moveTo(cx, cy);
      hudCtx.arc(cx, cy, 270, sweepRad, sweepRad + 0.5);
      hudCtx.closePath();
      hudCtx.fill();

      // Live coordinates readout
      const phaseDeg = ((orbitPhase * (180 / Math.PI)) % 360 + 360) % 360;
      hudCtx.fillStyle = 'rgba(234,244,255,0.7)';
      hudCtx.font = '10px ui-monospace, monospace';
      hudCtx.fillText(`θ ${phaseDeg.toFixed(1)}°`, cx - 26, 40);
      hudCtx.fillText(`TILT ${Math.round((orbitTiltRY / 210) * 21)}°`, cx - 26, 608);

      hudCtx.restore();
    }

    // Animation Loop for Orbit Map
    function updateOrbit() {
      if (isDetachingPlanet) {
        renderSunHud();
        orbitAnimFrame = requestAnimationFrame(updateOrbit);
        return;
      }

      if (!isOrbitDragging) {
        const targetV = orbitHoverTopic ? 0.0004 : 0.003;
        orbitPhase += orbitVelocity;
        orbitVelocity += (targetV - orbitVelocity) * 0.05;
      }

      const backEllipse = sceneEl.querySelector('#orbitBack');
      const frontEllipse = sceneEl.querySelector('#orbitFront');
      if (backEllipse && frontEllipse) {
        backEllipse.setAttribute('ry', orbitTiltRY);
        frontEllipse.setAttribute('ry', orbitTiltRY);
      }

      cardElements.forEach((card, i) => {
        const theta = orbitPhase + i * (Math.PI / 2);
        const cosT = Math.cos(theta);
        const sinT = Math.sin(theta);

        const cardX = CONFIG.orbitCX + CONFIG.orbitRX * cosT;
        const cardY = CONFIG.orbitCY + orbitTiltRY * sinT;

        const depth = (sinT + 1) * 0.5;
        const scale = 0.82 + 0.30 * depth;
        const opacity = 0.65 + 0.35 * depth;
        const zIndex = Math.round(depth * 100);

        card.style.left = `${cardX}px`;
        card.style.top = `${cardY}px`;
        card.style.zIndex = zIndex;
        card.style.opacity = opacity;

        if (!card.matches(':hover')) {
          card.style.transform = `scale(${scale})`;
        }
      });

      renderSunHud();
      orbitAnimFrame = requestAnimationFrame(updateOrbit);
    }

    if (orbitAnimFrame) cancelAnimationFrame(orbitAnimFrame);
    orbitAnimFrame = requestAnimationFrame(updateOrbit);

  } else if (isTopic) {
    // SCENE 3: TOPIC LESSONS GRID
    const lessons = node.children || [];
    let lessonsHtml = '';
    lessons.forEach((les, idx) => {
      const isVisited = appState.visited.has(les.id);
      lessonsHtml += `
        <div class="card pcard glass" data-target-id="${les.id}" tabindex="0" style="padding:24px;border-radius:18px;cursor:pointer;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
            <span style="font-family:var(--f-mono);font-size:12px;color:var(--accent);">BÀI 0${idx + 1}</span>
            ${isVisited ? '<span style="color:#00F5A0;">&#10004;</span>' : ''}
          </div>
          <h3 style="font-size:18px;font-weight:700;color:var(--ice);margin-bottom:8px;">${les.title}</h3>
          <p style="font-size:13.5px;color:var(--muted);line-height:1.5;">${les.short}</p>
        </div>
      `;
    });

    sceneEl.innerHTML = `
      <div style="position:absolute;left:60px;right:60px;top:80px;bottom:64px;overflow-y:auto;padding:20px 20px 60px 10px;">
        <div class="ql-hero">
          <div class="ql-hero-kicker">CHỦ ĐỀ KHẢO SÁT</div>
          <h1 class="h-title">${node.title}</h1>
          <p class="ql-hero-lead">${node.short}</p>
        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(420px, 1fr));gap:24px;">
          ${lessonsHtml}
        </div>
      </div>
    `;

    sceneEl.querySelectorAll('.pcard').forEach(c => {
      c.addEventListener('click', () => {
        if (window.AudioEngine) AudioEngine.playClick();
        navigateTo(c.dataset.targetId);
      });
    });

  } else if (isLesson) {
    // SCENE 4: LESSON SECTIONS LIST
    const sections = node.children || [];
    let secHtml = '';
    sections.forEach((s, idx) => {
      const isVisited = appState.visited.has(s.id);
      secHtml += `
        <div class="card pcard glass" data-target-id="${s.id}" tabindex="0" style="padding:22px;border-radius:18px;cursor:pointer;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
            <span style="font-family:var(--f-mono);font-size:12px;color:var(--accent);">MỤC 0${idx + 1}</span>
            ${isVisited ? '<span style="color:#00F5A0;">&#10004;</span>' : ''}
          </div>
          <h3 style="font-size:17px;font-weight:700;color:var(--ice);margin-bottom:6px;">${s.title}</h3>
          <p style="font-size:13.5px;color:var(--muted);line-height:1.5;">${s.short}</p>
        </div>
      `;
    });

    sceneEl.innerHTML = `
      <div style="position:absolute;left:60px;right:60px;top:80px;bottom:64px;overflow-y:auto;padding:20px 20px 60px 10px;">
        <div class="ql-hero">
          <div class="ql-hero-kicker">BÀI HỌC TRỌNG TÂM</div>
          <h1 class="h-title">${node.title}</h1>
          <p class="ql-hero-lead">${node.short}</p>
        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(420px, 1fr));gap:20px;">
          ${secHtml}
        </div>
      </div>
    `;

    sceneEl.querySelectorAll('.pcard').forEach(c => {
      c.addEventListener('click', () => {
        if (window.AudioEngine) AudioEngine.playClick();
        navigateTo(c.dataset.targetId);
      });
    });

  } else {
    // SCENE 5: DUAL-CHAMBER DETAIL VIEW (45fr / 55fr SPLIT & 3D CYLINDRICAL DRUM-ROLL SCROLL)
    const simKey = typeof node.visual === 'string' ? node.visual : (node.visual ? (node.visual.name || node.visual.type) : null);
    const hasSim = !!(simKey && SIMS[simKey]);

    // Theory cards HTML
    let theoryHtml = '';
    (node.body || []).forEach((b, idx) => {
      theoryHtml += `
        <div class="theory-card">
          <div class="tc-title">Luận điểm trọng tâm #${idx + 1}</div>
          <div class="tc-body">${b}</div>
        </div>
      `;
    });

    // Key points HTML
    let kpListHtml = '';
    (node.keyPoints || []).forEach(kp => {
      kpListHtml += `<li><span class="kp-bullet"></span><span>${kp}</span></li>`;
    });

    // Formula Chip HTML
    let formulaHtml = '';
    if (node.formula) {
      formulaHtml = `
        <div class="formula-chip-row">
          <div class="fc-left">
            <span class="fc-name">Công thức trọng tâm bài học</span>
            <span class="fc-legend">${node.formula.note || ''}</span>
          </div>
          <div class="fc-right">${node.formula.html || ''}</div>
        </div>
      `;
    }

    // Example Step-by-Step Reveal HTML
    let exampleHtml = '';
    if (node.example) {
      exampleHtml = `
        <div class="example-card" id="secExample">
          <div class="ex-header">
            <span class="ex-badge">VÍ DỤ ÁP DỤNG THỰC HÀNH</span>
            ${hasSim ? `<span class="ex-challenge-link" id="linkToSim">Tới phần Thử thách mô phỏng &rarr;</span>` : ''}
          </div>
          <div class="ex-prompt">${node.example.prompt}</div>
          <ul class="ex-steps-list">
            ${(node.example.steps || []).map((st, i) => `
              <li class="ex-step-item ${i > 0 ? 'hidden' : ''}" data-step="${i}">
                <span class="ex-step-n">Bước ${i + 1}:</span>
                <span>${st}</span>
              </li>
            `).join('')}
          </ul>
          <div class="ex-footer">
            <button class="btn btn-step-next" type="button">Hiện bước tiếp theo &rarr;</button>
            <div class="ex-ans-box">Đáp số: ${node.example.answer}</div>
          </div>
        </div>
      `;
    }

    const safeId = node.id.replace(/[^a-zA-Z0-9_-]/g, '_');

    sceneEl.innerHTML = `
      <div class="ql-detail-story" id="detailStory">
        <div class="ql-detail-grid ${hasSim ? 'has-sim' : 'no-sim'}" id="detailGrid">
          ${hasSim ? `
          <!-- LEFT CHAMBER: 3D SIMULATION COCKPIT (FIXED, NON-SCROLLING) -->
          <div class="ql-sim-left-col" id="simLeftCol"></div>
          ` : ''}

          <!-- RIGHT CHAMBER: THEORY, FORMULAS, DATA/CHALLENGE, WORKED EXAMPLE (INDEPENDENT SCROLL & 3D DRUM-ROLL) -->
          <div class="ql-content-right-col" id="simRightCol">
            <!-- 1. Hero Header -->
            <div class="ql-hero" id="secHero_${safeId}">
              <div class="ql-hero-kicker">KIẾN THỨC CHI TIẾT &bull; KHẢO SÁT CHUYÊN SÂU</div>
              <h1 class="h-title">${node.title}</h1>
              <p class="ql-hero-lead">${node.short}</p>
            </div>

            <!-- 2. Lý thuyết -->
            <div class="story-sec-title" id="secTheory_${safeId}">01 &bull; LÝ THUYẾT VÀ BẢN CHẤT VẬT LÍ</div>
            <div class="ql-theory-grid">${theoryHtml}</div>
            ${kpListHtml ? `
              <div class="glass" style="padding:22px 26px;margin-bottom:20px;">
                <div style="font-size:15px;font-weight:700;color:var(--accent);margin-bottom:12px;">ĐIỂM CỐT LÕI CẦN GHI NHỚ:</div>
                <ul class="key-points-list">${kpListHtml}</ul>
              </div>
            ` : ''}

            <!-- 3. Công thức -->
            ${formulaHtml ? `
              <div class="story-sec-title" id="secFormula_${safeId}">02 &bull; HỆ THỨC VÀ CÔNG THỨC TOÁN HỌC</div>
              <div class="formula-chips-wrap">${formulaHtml}</div>
            ` : ''}

            <!-- 4. Thông số mô phỏng & Thử thách dự đoán -->
            ${hasSim ? `
              <div class="story-sec-title" id="secSimData_${safeId}">03 &bull; DỮ LIỆU THỰC NGHIỆM & THỬ THÁCH DỰ ĐOÁN</div>
              <div class="sim-data-mount" id="simDataMount"></div>
            ` : ''}

            <!-- 5. Ví dụ áp dụng -->
            ${exampleHtml ? `
              <div class="story-sec-title" id="secExample_${safeId}">${hasSim ? '04' : '03'} &bull; VÍ DỤ MINH HỌA & BÀI TẬP VẬN DỤNG</div>
              ${exampleHtml}
            ` : ''}

            <!-- 6. Footer Navigation -->
            <div class="story-footer-nav">
              <button class="btn-nav-step" id="btnPrevLesson">&larr; Bài trước</button>
              <button class="btn-nav-step" id="btnNextLesson">Bài tiếp theo &rarr;</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Vertical Section Spy Dots on Right Edge -->
      <div class="ql-spy-dots" id="spyDots">
        <div class="spy-dot active" data-target="secHero_${safeId}" title="Đầu trang"></div>
        <div class="spy-dot" data-target="secTheory_${safeId}" title="Lý thuyết"></div>
        ${formulaHtml ? `<div class="spy-dot" data-target="secFormula_${safeId}" title="Công thức"></div>` : ''}
        ${hasSim ? `<div class="spy-dot" data-target="secSimData_${safeId}" title="Dữ liệu & Thử thách"></div>` : ''}
        ${exampleHtml ? `<div class="spy-dot" data-target="secExample_${safeId}" title="Ví dụ"></div>` : ''}
      </div>
    `;

    // Step-by-Step Reveal Handler
    const stepBtn = sceneEl.querySelector('.btn-step-next');
    const stepItems = sceneEl.querySelectorAll('.ex-step-item');
    const ansBox = sceneEl.querySelector('.ex-ans-box');
    let currentStep = 0;

    if (stepBtn) {
      stepBtn.addEventListener('click', () => {
        currentStep++;
        if (currentStep < stepItems.length) {
          stepItems[currentStep].classList.remove('hidden');
          if (window.AudioEngine) AudioEngine.playTick();
        }
        if (currentStep >= stepItems.length - 1) {
          stepBtn.style.display = 'none';
          if (ansBox) ansBox.style.display = 'block';
          if (window.AudioEngine) AudioEngine.playCorrect();
        }
      });
    }

    // Right Chamber: 3D Cylindrical Drum-Roll Scroll Engine (Pillar 5)
    const rightChamber = sceneEl.querySelector('#simRightCol');
    const dots = sceneEl.querySelectorAll('.spy-dot');

    if (rightChamber) {
      let drumRaf = null;
      function updateDrumRoll() {
        const chamberRect = rightChamber.getBoundingClientRect();
        const chamberCenterY = chamberRect.top + chamberRect.height * 0.5;
        const cards = rightChamber.querySelectorAll('.theory-card, .formula-chip-row, .example-card, .sim-data-mount, .sim-challenge-box, .sim-readouts-box');
        cards.forEach(c => {
          const cRect = c.getBoundingClientRect();
          const cCenterY = cRect.top + cRect.height * 0.5;
          const deltaY = cCenterY - chamberCenterY;
          const norm = Math.max(-1, Math.min(1, deltaY / (chamberRect.height * 0.55)));
          const rotX = -norm * 24;
          const transZ = -Math.abs(norm) * 40;
          const op = 1.0 - Math.abs(norm) * 0.16;
          c.style.transform = `perspective(1200px) rotateX(${rotX.toFixed(1)}deg) translateZ(${transZ.toFixed(1)}px)`;
          c.style.opacity = op.toFixed(2);
        });

        // Scroll spy dots
        const scrollY = rightChamber.scrollTop;
        dots.forEach(d => {
          const el = document.getElementById(d.dataset.target);
          if (el) {
            const top = el.offsetTop - 140;
            const bottom = top + el.offsetHeight;
            if (scrollY >= top && scrollY < bottom) {
              dots.forEach(other => other.classList.remove('active'));
              d.classList.add('active');
            }
          }
        });
      }

      rightChamber.addEventListener('scroll', () => {
        if (drumRaf) cancelAnimationFrame(drumRaf);
        drumRaf = requestAnimationFrame(updateDrumRoll);
      }, { passive: true });

      requestAnimationFrame(updateDrumRoll);
    }

    dots.forEach(dot => {
      dot.addEventListener('click', () => {
        const targetId = dot.dataset.target;
        const targetEl = document.getElementById(targetId);
        if (targetEl && rightChamber) {
          targetEl.scrollIntoView({ behavior: 'smooth' });
          if (window.AudioEngine) AudioEngine.playTick();
        }
      });
    });

    // Link from Example to Sim Challenge
    const simLink = sceneEl.querySelector('#linkToSim');
    if (simLink) {
      simLink.addEventListener('click', () => {
        const targetEl = sceneEl.querySelector('#secSimData_' + safeId) || sceneEl.querySelector('.sim-challenge-box');
        if (targetEl) targetEl.scrollIntoView({ behavior: 'smooth' });
      });
    }

    // Navigation Prev / Next
    function getAllSectionIds(n) {
      let ids = [];
      if (n.kind === 'detail' || (!n.children && n.id && n.id.startsWith('sec-'))) {
        ids.push(n.id);
      }
      if (n.children) {
        n.children.forEach(c => { ids = ids.concat(getAllSectionIds(c)); });
      }
      return ids;
    }
    const allSecs = getAllSectionIds(CURRICULUM);
    const curIdx = allSecs.indexOf(node.id);
    const btnPrev = sceneEl.querySelector('#btnPrevLesson');
    const btnNext = sceneEl.querySelector('#btnNextLesson');
    if (btnPrev) {
      if (curIdx > 0) {
        btnPrev.addEventListener('click', () => {
          if (window.AudioEngine) AudioEngine.playClick();
          navigateTo(allSecs[curIdx - 1]);
        });
      } else {
        btnPrev.style.opacity = '0.35';
        btnPrev.style.pointerEvents = 'none';
      }
    }
    if (btnNext) {
      if (curIdx >= 0 && curIdx < allSecs.length - 1) {
        btnNext.addEventListener('click', () => {
          if (window.AudioEngine) AudioEngine.playClick();
          navigateTo(allSecs[curIdx + 1]);
        });
      } else {
        btnNext.style.opacity = '0.35';
        btnNext.style.pointerEvents = 'none';
      }
    }

    // Mount and initialize simulation
    if (hasSim) {
      try {
        const topicColor = getTopicColor(node.id);
        const simFactory = SIMS[simKey];
        if (typeof simFactory === 'function') {
          const simParams = (typeof node.visual === 'object' && node.visual.params) ? node.visual.params : {};
          appState.activeSim = simFactory(sceneEl, {
            secId: node.id,
            accentColor: topicColor,
            challenges: node.challenges || [],
            params: simParams,
            ...simParams
          });
          ProgressEngine.markSectionOpened(node.id);
        }
      } catch (err) {
        console.error("Simulation mount error for", node.id, err);
        const errMount = sceneEl.querySelector('#simLeftCol') || sceneEl.querySelector('#detailStory');
        if (errMount) {
          errMount.innerHTML = `
            <div class="glass" style="padding:24px;color:#FF8A00;">
              Mô phỏng đang được tối ưu hóa cho phần cứng này. Vui lòng tiếp tục khảo sát lý thuyết và bài tập.
            </div>
          `;
        }
      }
    }
  }

  return sceneEl;
}

function getTopicColor(id) {
  if (id.includes('topic-01') || id.includes('1.')) return '#FF8A00';
  if (id.includes('topic-02') || id.includes('2.')) return '#00F5A0';
  if (id.includes('topic-03') || id.includes('3.')) return '#00E5FF';
  if (id.includes('topic-04') || id.includes('4.')) return '#B347FF';
  return '#00E5FF';
}

/* ==========================================================================
   4. MORPH ENGINE (FLIP SCENE TRANSITIONS)
   ========================================================================== */
function executeMorph(oldScene, newScene, isBack = false, onComplete = null) {
  appState.isMorphing = true;

  const finishMorph = () => {
    if (morphSafetyTimer) {
      clearTimeout(morphSafetyTimer);
      morphSafetyTimer = null;
    }
    if (oldScene && oldScene.parentNode) {
      oldScene.parentNode.removeChild(oldScene);
    }
    appState.isMorphing = false;
    if (onComplete) {
      try { onComplete(); } catch (err) { console.error("onComplete error:", err); }
    }
  };

  try {
    if (oldScene) {
      oldScene.querySelectorAll('[id]').forEach(el => el.removeAttribute('id'));
    }
    Array.from(scenesEl.children).forEach(child => {
      if (child !== oldScene && child !== newScene) {
        if (child.parentNode) child.parentNode.removeChild(child);
      }
    });
    if (!newScene.parentNode) {
      scenesEl.appendChild(newScene);
    }

    if (!isBack && newScene.dataset.depth > 1) {
      appState.worldZoom = 1.45;
    } else if (isBack && newScene.dataset.depth <= 1) {
      appState.worldZoom = 1.0;
    }

    newScene.style.opacity = '0';
    newScene.style.transform = isBack ? 'scale(1.08)' : 'scale(0.94)';
    newScene.style.transition = 'opacity 500ms cubic-bezier(0.22,1,0.36,1), transform 500ms cubic-bezier(0.22,1,0.36,1)';

    if (oldScene) {
      oldScene.style.opacity = '1';
      oldScene.style.transform = 'scale(1)';
      oldScene.style.transition = 'opacity 400ms cubic-bezier(0.22,1,0.36,1), transform 400ms cubic-bezier(0.22,1,0.36,1)';
    }

    requestAnimationFrame(() => {
      try {
        newScene.style.opacity = '1';
        newScene.style.transform = 'scale(1)';
        if (oldScene) {
          oldScene.style.opacity = '0';
          oldScene.style.transform = isBack ? 'scale(0.94)' : 'scale(1.08)';
        }
      } catch (rErr) {
        console.error("rAF step error:", rErr);
      }
      setTimeout(finishMorph, 520);
    });
  } catch (err) {
    console.error("executeMorph setup error:", err);
    finishMorph();
  }
}

/* ==========================================================================
   5. NAVIGATION (CANONICAL ANCESTRY, CRUMBS, BACK BUTTON)
   ========================================================================== */
function findNodeById(root, id) {
  if (id === 'root' || id === 'home') return root;
  if (id === 'map') return root;
  if (root.id === id) return root;
  if (root.children) {
    for (const child of root.children) {
      const found = findNodeById(child, id);
      if (found) return found;
    }
  }
  return null;
}

function findNodePath(root, targetId) {
  if (targetId === 'home' || targetId === 'root') {
    return ['root'];
  }
  if (targetId === 'map') {
    return ['root', 'map'];
  }

  function search(node) {
    if (node.id === targetId) {
      return [node.id];
    }
    if (node.children) {
      for (const child of node.children) {
        const sub = search(child);
        if (sub) {
          return [node.id, ...sub];
        }
      }
    }
    return null;
  }

  const raw = search(root);
  if (!raw) {
    return ['root', 'map', targetId];
  }

  const path = ['root', 'map'];
  for (let i = 1; i < raw.length; i++) {
    path.push(raw[i]);
  }
  return path;
}

function updateBreadcrumbs() {
  if (!crumbsEl) return;
  crumbsEl.innerHTML = '';

  const btnBack = document.getElementById('btnBack');
  const path = appState.path;

  if (path.length <= 1 && appState.isHome) {
    if (btnBack) btnBack.style.display = 'none';
  } else {
    if (btnBack) btnBack.style.display = 'flex';
  }

  path.forEach((id, idx) => {
    let title = 'Trang chủ';
    if (id === 'map') {
      title = 'Bản đồ 3D';
    } else if (id !== 'root') {
      const n = findNodeById(CURRICULUM, id);
      if (n) title = n.title;
    }

    if (idx > 0) {
      const sep = document.createElement('span');
      sep.className = 'crumb-sep';
      sep.textContent = '>';
      crumbsEl.appendChild(sep);
    }

    const item = document.createElement('span');
    const isLast = (idx === path.length - 1);
    item.className = 'crumb-link' + (isLast ? ' active' : '');
    item.textContent = title;
    item.dataset.index = idx;
    item.dataset.id = id;

    if (!isLast) {
      item.addEventListener('click', (e) => {
        e.stopPropagation();
        const clickedIdx = parseInt(item.dataset.index, 10);
        if (clickedIdx >= 0 && clickedIdx < appState.path.length - 1) {
          appState.path = appState.path.slice(0, clickedIdx + 1);
          if (window.AudioEngine) AudioEngine.playClick();
          transitionToPath(appState.path, true);
        }
      });
    }

    crumbsEl.appendChild(item);
  });
}

function updateGlobalProgressBar() {
  if (!globalProgEl) return;
  const topics = CURRICULUM.children || [];
  let totalPercent = 0;
  topics.forEach((top, i) => {
    const p = ProgressEngine.getTopicProgress(top.id);
    totalPercent += p.percent;
    const seg = globalProgEl.querySelector(`.bar-seg.t${i + 1}`);
    if (seg) seg.style.width = `${p.percent * 0.25}%`;
  });
  const avg = Math.round(totalPercent / topics.length);
  const textEl = document.getElementById('progPercentText');
  if (textEl) textEl.textContent = `TỔNG TIẾN ĐỘ ${avg}%`;
}

function transitionToPath(targetPath, isBack = false) {
  if (appState.isMorphing) return;

  if (appState.activeSim && typeof appState.activeSim.destroy === 'function') {
    try { appState.activeSim.destroy(); } catch (e) { console.error("Sim cleanup error:", e); }
    appState.activeSim = null;
  }

  if (orbitAnimFrame) {
    cancelAnimationFrame(orbitAnimFrame);
    orbitAnimFrame = null;
  }

  const activeId = targetPath[targetPath.length - 1];
  appState.isHome = (activeId === 'root');
  appState.path = [...targetPath];
  appState.visited.add(activeId);

  // Set topic theme color
  let activeTopic = 'topic-01';
  for (const seg of targetPath) {
    if (seg.startsWith('topic-')) { activeTopic = seg; break; }
    if (seg.startsWith('sec-1')) { activeTopic = 'topic-01'; break; }
    if (seg.startsWith('sec-2')) { activeTopic = 'topic-02'; break; }
    if (seg.startsWith('sec-3')) { activeTopic = 'topic-03'; break; }
    if (seg.startsWith('sec-4')) { activeTopic = 'topic-04'; break; }
  }
  appState.targetTopicId = activeTopic;
  stageEl.setAttribute('data-topic', activeTopic);

  // Telemetry HUD coordinates update
  const hudCoord = document.getElementById('hudCoord');
  if (hudCoord) {
    const topicLabels = { 'topic-01': 'NHIỆT', 'topic-02': 'KHÍ', 'topic-03': 'TỪ TRƯỜNG', 'topic-04': 'HẠT NHÂN' };
    const label = topicLabels[activeTopic] || 'VẬT LÍ 12';
    hudCoord.textContent = `[${label} // SYS ACTIVE]`;
  }

  const targetNode = findNodeById(CURRICULUM, activeId) || CURRICULUM;
  const currentScene = scenesEl.querySelector('.scene');
  const newScene = renderScene(targetNode, targetPath.length - 1, appState.path);

  executeMorph(currentScene, newScene, isBack, () => {
    updateBreadcrumbs();
    updateGlobalProgressBar();
  });
}

function navigateTo(targetId) {
  if (appState.isMorphing) return;
  const canonicalPath = findNodePath(CURRICULUM, targetId);
  const isBack = canonicalPath.length < appState.path.length;
  transitionToPath(canonicalPath, isBack);
}

function goBack() {
  if (appState.isMorphing) return;
  if (appState.path.length <= 1) return;

  if (window.AudioEngine) {
    AudioEngine.playClick();
    AudioEngine.playZoomTransition(true);
  }

  const newPath = appState.path.slice(0, -1);
  transitionToPath(newPath, true);
}

function goHome() {
  if (appState.isHome) return;
  if (window.AudioEngine) AudioEngine.playClick();
  transitionToPath(['root'], true);
}

/* ==========================================================================
   6. RESPONSIVE STAGE & TOUCH RESCALE
   ========================================================================== */
function updateStageScale() {
  const ww = window.innerWidth;
  const wh = window.innerHeight;
  const targetW = CONFIG.stageWidth;
  const targetH = CONFIG.stageHeight;

  const scale = Math.min(ww / targetW, wh / targetH);
  appState.currentScale = scale;

  stageEl.style.setProperty('--stage-scale', scale.toFixed(5));
  stageEl.style.transform = `scale(${scale})`;

  const hintEl = document.getElementById('portraitHint');
  if (hintEl) {
    if (wh > ww && scale < 0.6) {
      hintEl.style.display = 'flex';
    } else {
      hintEl.style.display = 'none';
    }
  }

  if (World && World.resize) World.resize();
  if (appState.activeSim && appState.activeSim.resize) appState.activeSim.resize();
}

window.addEventListener('resize', updateStageScale);
window.addEventListener('orientationchange', updateStageScale);

/* ==========================================================================
   7. ENERGY CONDUIT LASER BEAM (PILLAR 6)
   ========================================================================== */
window.triggerEnergyConduitBeam = function(sourceBtn) {
  const beamCanvas = document.getElementById('beamCanvas');
  if (!beamCanvas) return;
  const dpr = window.devicePixelRatio || 1;
  const bCtx = beamCanvas.getContext('2d');
  beamCanvas.width = Math.round(window.innerWidth * dpr);
  beamCanvas.height = Math.round(window.innerHeight * dpr);

  const srcRect = sourceBtn ? sourceBtn.getBoundingClientRect() : null;
  const targetCanvas = document.querySelector('.g3d-canvas');
  const tgtRect = targetCanvas ? targetCanvas.getBoundingClientRect() : null;
  if (!srcRect || !tgtRect) return;

  const startX = (srcRect.left + srcRect.width * 0.5) * dpr;
  const startY = (srcRect.top + srcRect.height * 0.5) * dpr;
  const endX = (tgtRect.left + tgtRect.width * 0.5) * dpr;
  const endY = (tgtRect.top + tgtRect.height * 0.5) * dpr;

  if (window.AudioEngine && AudioEngine.triggerBeamSfx) {
    AudioEngine.triggerBeamSfx();
  }

  const startTime = performance.now();
  const duration = 520; // ms

  function animBeam(now) {
    const elapsed = now - startTime;
    const progress = Math.min(1, elapsed / duration);
    bCtx.clearRect(0, 0, beamCanvas.width, beamCanvas.height);

    if (progress < 1) {
      const alpha = Math.sin(progress * Math.PI);

      bCtx.save();
      bCtx.globalCompositeOperation = 'lighter';

      // Outer glow
      bCtx.strokeStyle = 'rgba(53, 224, 255, ' + (alpha * 0.8) + ')';
      bCtx.lineWidth = 14 * dpr;
      bCtx.beginPath();
      bCtx.moveTo(startX, startY);
      bCtx.lineTo(endX, endY);
      bCtx.stroke();

      // Middle beam
      bCtx.strokeStyle = 'rgba(0, 245, 160, ' + alpha + ')';
      bCtx.lineWidth = 6 * dpr;
      bCtx.beginPath();
      bCtx.moveTo(startX, startY);
      bCtx.lineTo(endX, endY);
      bCtx.stroke();

      // Core white laser
      bCtx.strokeStyle = 'rgba(255, 255, 255, ' + alpha + ')';
      bCtx.lineWidth = 2.5 * dpr;
      bCtx.beginPath();
      bCtx.moveTo(startX, startY);
      bCtx.lineTo(endX, endY);
      bCtx.stroke();

      // Branching lightning arcs
      const steps = 8;
      bCtx.strokeStyle = 'rgba(168, 85, 247, ' + (alpha * 0.9) + ')';
      bCtx.lineWidth = 2 * dpr;
      bCtx.beginPath();
      bCtx.moveTo(startX, startY);
      for (let s = 1; s < steps; s++) {
        const t = s / steps;
        const px = startX + (endX - startX) * t;
        const py = startY + (endY - startY) * t;
        const jitter = (Math.random() - 0.5) * 45 * dpr * (1 - Math.abs(t - 0.5) * 2);
        bCtx.lineTo(px, py + jitter);
      }
      bCtx.lineTo(endX, endY);
      bCtx.stroke();

      // Spark particles at destination
      for (let p = 0; p < 8; p++) {
        const rad = Math.random() * Math.PI * 2;
        const dist = Math.random() * 40 * dpr * progress;
        bCtx.fillStyle = 'rgba(255, 255, 255, ' + alpha + ')';
        bCtx.beginPath();
        bCtx.arc(endX + Math.cos(rad) * dist, endY + Math.sin(rad) * dist, 3 * dpr, 0, Math.PI * 2);
        bCtx.fill();
      }

      bCtx.restore();
      requestAnimationFrame(animBeam);
    } else {
      bCtx.clearRect(0, 0, beamCanvas.width, beamCanvas.height);
    }
  }

  requestAnimationFrame(animBeam);
};

/* ==========================================================================
   8. SCI-FI CURSOR RETICLE (PILLAR 6)
   ========================================================================== */
function initCursorReticle() {
  const cursorReticle = document.getElementById('cursorReticle');
  if (cursorReticle && window.matchMedia('(pointer: fine)').matches) {
    let mouseX = -100, mouseY = -100;
    let curX = -100, curY = -100;
    let isReticleActive = false;

    window.addEventListener('pointermove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      if (!isReticleActive) {
        isReticleActive = true;
        cursorReticle.classList.add('active');
        curX = mouseX;
        curY = mouseY;
      }
      const target = e.target;
      if (target && (target.closest('button, .card, .crumb-link, .orbit-card, .preset-chip, input, a') || target.tagName === 'CANVAS')) {
        cursorReticle.classList.add('hovering');
      } else {
        cursorReticle.classList.remove('hovering');
      }
    }, { passive: true });

    function updateReticle() {
      curX += (mouseX - curX) * 0.35;
      curY += (mouseY - curY) * 0.35;
      cursorReticle.style.transform = `translate(${curX}px, ${curY}px)`;
      requestAnimationFrame(updateReticle);
    }
    requestAnimationFrame(updateReticle);
  }
}

/* ==========================================================================
   9. BOOTSTRAP & EVENT LISTENERS
   ========================================================================== */
function boot() {
  updateStageScale();
  initCursorReticle();

  // Ensure Web Audio syncs immediately
  function unlockAudio() {
    if (window.AudioEngine) {
      AudioEngine.ensureUserGesture();
    }
  }
  window.addEventListener('pointerdown', unlockAudio, { capture: true, passive: true });
  window.addEventListener('click', unlockAudio, { capture: true, passive: true });
  window.addEventListener('keydown', unlockAudio, { capture: true, passive: true });
  window.addEventListener('touchstart', unlockAudio, { capture: true, passive: true });

  // Global Event Delegation for Interactive UI Sounds (Hover, Click & Slider ticks)
  let lastHoverEl = null;
  document.addEventListener('pointerover', (e) => {
    const el = e.target.closest('button, .btn, .pcard, .card, .orbit-card, .core-tab, .spy-dot, .preset-chip, .ch-choice-label, .btn-tool, .btn-icon, .btn-nav-step, .formula-chip-row, .crumb-item, .ex-header, .ex-step-item');
    if (el && el !== lastHoverEl) {
      lastHoverEl = el;
      if (window.AudioEngine) AudioEngine.playHover();
    }
  }, true);

  document.addEventListener('pointerout', (e) => {
    if (lastHoverEl && !lastHoverEl.contains(e.relatedTarget)) {
      lastHoverEl = null;
    }
  }, true);

  // Global Pointerdown User Gesture Unlock & Click Sound
  document.addEventListener('pointerdown', (e) => {
    const clickable = e.target.closest('button, .btn, .pcard, .card, .orbit-card, .core-tab, .spy-dot, .preset-chip, .btn-tool, .btn-icon, .btn-nav-step, .crumb-item, .ch-choice-label');
    if (clickable) {
      if (window.AudioEngine) AudioEngine.playClick();
    }
  }, true);

  // Slider dragging tick sound
  let lastSliderTick = 0;
  document.addEventListener('input', (e) => {
    if (e.target && e.target.type === 'range') {
      const now = performance.now();
      if (now - lastSliderTick > 60) {
        lastSliderTick = now;
        if (window.AudioEngine) AudioEngine.playTick();
      }
    }
  }, true);

  // Keyboard navigation: Back / Esc
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' || e.key === 'Backspace') {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
      goBack();
    }
  });

  // Top HUD buttons
  const btnAudioToggle = document.getElementById('btnAudioToggle');
  const btnSettings = document.getElementById('btnSettings');
  const settingsPopover = document.getElementById('settingsPopover');

  if (btnAudioToggle) {
    btnAudioToggle.innerHTML = AudioEngine.isSoundEnabled ? ICONS.speakerOn : ICONS.speakerOff;
    btnAudioToggle.classList.remove('pulse-hint');
    btnAudioToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      AudioEngine.ensureUserGesture();
      const nextState = !AudioEngine.isSoundEnabled;
      AudioEngine.setSoundEnabled(nextState);
      btnAudioToggle.innerHTML = nextState ? ICONS.speakerOn : ICONS.speakerOff;
      const chkSound = document.getElementById('chkSound');
      if (chkSound) chkSound.checked = nextState;
      if (nextState) AudioEngine.playClick();
    });
  }

  if (btnSettings && settingsPopover) {
    btnSettings.addEventListener('click', (e) => {
      e.stopPropagation();
      settingsPopover.classList.toggle('open');
      if (window.AudioEngine) AudioEngine.playClick();
    });

    document.addEventListener('click', (e) => {
      if (settingsPopover.classList.contains('open') && !settingsPopover.contains(e.target) && e.target !== btnSettings) {
        settingsPopover.classList.remove('open');
      }
    });
  }

  // Settings popover controls
  const chkSound = document.getElementById('chkSound');
  const chkBgm = document.getElementById('chkBgm');
  const chkHaptics = document.getElementById('chkHaptics');
  const slVolume = document.getElementById('slVolume');
  const slBgmVolume = document.getElementById('slBgmVolume');
  const btnResetProg = document.getElementById('btnResetProg');
  const btnCloseHint = document.getElementById('btnCloseHint');

  if (btnCloseHint) {
    btnCloseHint.addEventListener('click', () => {
      const hint = document.getElementById('portraitHint');
      if (hint) hint.style.display = 'none';
    });
  }

  if (chkSound) {
    chkSound.checked = AudioEngine.isSoundEnabled;
    chkSound.addEventListener('change', () => {
      AudioEngine.setSoundEnabled(chkSound.checked);
      if (btnAudioToggle) {
        btnAudioToggle.innerHTML = chkSound.checked ? ICONS.speakerOn : ICONS.speakerOff;
        btnAudioToggle.classList.remove('pulse-hint');
      }
    });
  }

  if (chkBgm) {
    chkBgm.checked = AudioEngine.isBgmEnabled;
    chkBgm.addEventListener('change', () => {
      AudioEngine.setBgmEnabled(chkBgm.checked);
    });
  }

  if (chkHaptics) {
    chkHaptics.checked = AudioEngine.isHapticsEnabled;
    chkHaptics.addEventListener('change', () => {
      AudioEngine.setHapticsEnabled(chkHaptics.checked);
    });
  }

  if (slVolume) {
    slVolume.value = AudioEngine.volume * 100;
    slVolume.addEventListener('input', () => {
      AudioEngine.setVolume(parseFloat(slVolume.value) / 100);
    });
  }

  if (slBgmVolume) {
    slBgmVolume.value = AudioEngine.bgmVolume * 100;
    slBgmVolume.addEventListener('input', () => {
      AudioEngine.setBgmVolume(parseFloat(slBgmVolume.value) / 100);
    });
  }

  if (btnResetProg) {
    btnResetProg.addEventListener('click', () => {
      if (confirm('Bạn có chắc chắn muốn đặt lại toàn bộ tiến độ học tập?')) {
        ProgressEngine.resetProgress();
        updateGlobalProgressBar();
        alert('Đã đặt lại tiến độ.');
      }
    });
  }

  ProgressEngine.onChange(() => {
    updateGlobalProgressBar();
  });

  const btnBack = document.getElementById('btnBack');
  if (btnBack) {
    btnBack.addEventListener('click', () => {
      goBack();
    });
  }

  // Initial render (Scene 1: Home)
  const homeScene = renderScene(CURRICULUM, 0);
  scenesEl.appendChild(homeScene);
  updateBreadcrumbs();
  updateGlobalProgressBar();
}

window.addEventListener('DOMContentLoaded', boot);

</script>
