<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vật lí 12 - Bản đồ Tri thức &amp; Không gian Mô phỏng 3D</title>
<style>
/* ==========================================================================
   PILLAR 1: MULTI-COLOR SCI-FI IDENTITY, TYPOGRAPHY, GLASS & HUD
   ========================================================================== */
:root {
  /* 4 Topic Accents & Glows */
  --c-nhiet: #FF8A00;
  --c-nhiet-glow: rgba(255,138,0,0.45);
  --c-khi: #00F5A0;
  --c-khi-glow: rgba(0,245,160,0.45);
  --c-tu: #00E5FF;
  --c-tu-glow: rgba(0,229,255,0.45);
  --c-hn: #B347FF;
  --c-hn-glow: rgba(179,71,255,0.45);

  /* Active Accent (Remapped dynamically via [data-topic]) */
  --accent: var(--c-tu);
  --accent-glow: var(--c-tu-glow);

  /* Shared Neutrals */
  --bg-deep: #030714;
  --ice: #EAF4FF;
  --muted: rgba(234,244,255,0.65);
  --faint: rgba(234,244,255,0.25);
  --border-subtle: rgba(53,224,255,0.2);

  /* Typography Stacks */
  --f-body: "Inter", "Segoe UI", "SF Pro Display", system-ui, -apple-system, "Roboto", "Noto Sans", sans-serif;
  --f-display: "Inter", "Segoe UI", "SF Pro Display", system-ui, -apple-system, sans-serif;
  --f-mono: ui-monospace, "SF Mono", "JetBrains Mono", Consolas, monospace;

  /* Stage Scale & Responsive Boost */
  --stage-scale: 1;
  --boost: 1;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

[data-topic="topic-01"] { --accent: var(--c-nhiet); --accent-glow: var(--c-nhiet-glow); }
[data-topic="topic-02"] { --accent: var(--c-khi); --accent-glow: var(--c-khi-glow); }
[data-topic="topic-03"] { --accent: var(--c-tu); --accent-glow: var(--c-tu-glow); }
[data-topic="topic-04"] { --accent: var(--c-hn); --accent-glow: var(--c-hn-glow); }

/* Base Reset & Cosmic Background */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%; height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at 50% 40%, #061129 0%, #030714 65%, #010207 100%);
  color: var(--ice);
  font-family: var(--f-body);
  user-select: none;
  -webkit-user-select: none;
  overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
}

/* Custom Luxury Glowing Scrollbars */
:root {
  scrollbar-width: thin;
  scrollbar-color: rgba(53,224,255,0.5) rgba(5,11,31,0.6);
}
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: rgba(5,11,31,0.6); border-radius: 4px; }
::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg, var(--accent) 0%, #35E0FF 50%, #A855F7 100%);
  border-radius: 4px;
  box-shadow: 0 0 10px var(--accent-glow);
}
::-webkit-scrollbar-thumb:hover { background: #FFFFFF; }

/* 1920x1080 Stage Container */
#app {
  position: relative;
  width: 100vw; height: 100vh; height: 100dvh;
  display: flex; align-items: center; justify-content: center;
}

#bgCanvas {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 1;
}

#stage {
  position: relative;
  width: 1920px; height: 1080px;
  transform-origin: center center;
  transform: scale(var(--stage-scale));
  flex-shrink: 0;
  overflow: hidden;
  z-index: 2;
}

/* Upgraded Glassmorphism */
.glass {
  backdrop-filter: blur(28px) saturate(140%);
  -webkit-backdrop-filter: blur(28px) saturate(140%);
  background: rgba(7,16,40,0.72);
  border: 1px solid rgba(53,224,255,0.28);
  border-top: 1px solid rgba(255,255,255,0.22);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 20px 50px rgba(0,0,0,0.6), 0 0 30px rgba(47,107,255,0.12);
  border-radius: 20px;
}

/* Typography Enhancements */
.home-title, .h-title {
  font-family: var(--f-display);
  font-weight: 800;
  background: linear-gradient(135deg, #FFFFFF 30%, #35E0FF 70%, #A855F7 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 18px rgba(53,224,255,0.35));
  padding-bottom: 0.12em;
  letter-spacing: -0.02em;
}

.h-title {
  font-size: 42px;
  line-height: 1.25;
  margin: 12px 0 14px 0;
}

/* Stage HUD Headers & Footers */
.top-hud {
  position: absolute;
  top: 24px; left: 60px; right: 60px;
  height: 54px;
  display: flex; align-items: center; justify-content: space-between;
  z-index: 50;
  pointer-events: none;
}

.hud-left {
  display: flex; align-items: center; gap: 16px;
  pointer-events: auto;
}

.crumbs {
  display: flex; align-items: center; gap: 8px;
  font-size: 14px; color: var(--muted);
  font-family: var(--f-mono);
  pointer-events: auto;
}
.crumbs .crumb-link {
  color: rgba(234,244,255,0.7); cursor: pointer; text-decoration: none;
  transition: color 180ms ease, opacity 180ms ease;
  user-select: none;
}
.crumbs .crumb-link:hover { color: var(--accent); text-shadow: 0 0 10px var(--accent-glow); }
.crumbs .crumb-link.active {
  color: var(--ice); cursor: default; pointer-events: none; opacity: 0.95; font-weight: 600;
}
.crumbs .crumb-sep { color: var(--faint); user-select: none; }

.hud-actions {
  display: flex; align-items: center; gap: 12px;
  pointer-events: auto;
}

.btn-icon {
  width: 44px; height: 44px;
  border-radius: 12px;
  background: rgba(7,16,40,0.6);
  border: 1px solid rgba(53,224,255,0.25);
  color: var(--ice);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: all 200ms var(--ease);
  pointer-events: auto;
}
.btn-icon:hover {
  background: rgba(53,224,255,0.15);
  border-color: var(--accent);
  box-shadow: 0 0 14px var(--accent-glow);
}
.btn-icon.pulse-hint {
  animation: ql-pulse 2s infinite ease-in-out;
}
@keyframes ql-pulse {
  0%, 100% { box-shadow: 0 0 0 rgba(53,224,255,0); }
  50% { box-shadow: 0 0 16px var(--accent); }
}

.bottom-hud {
  position: absolute;
  bottom: 20px; left: 60px; right: 60px;
  height: 44px;
  display: flex; align-items: center; justify-content: space-between;
  z-index: 50;
  pointer-events: none;
  font-family: var(--f-mono);
  font-size: 12px;
  color: rgba(234,244,255,0.65);
}
.bottom-hud > * { pointer-events: auto; }

.global-progress-bar {
  display: flex; align-items: center; gap: 12px;
  width: 420px;
}
.bar-track {
  flex: 1; height: 6px;
  border-radius: 3px;
  background: rgba(255,255,255,0.1);
  overflow: hidden;
  display: flex;
}
.bar-seg { height: 100%; transition: width 300ms var(--ease); }
.bar-seg.t1 { background: var(--c-nhiet); }
.bar-seg.t2 { background: var(--c-khi); }
.bar-seg.t3 { background: var(--c-tu); }
.bar-seg.t4 { background: var(--c-hn); }

/* Scene Containers */
.scene {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
}

/* ==========================================================================
   SCENE 1: HOME (HERO TITLE 160px & TITANIUM SHEEN)
   ========================================================================== */
.home-kicker {
  position: absolute; left: 140px; top: 180px;
  font-family: var(--f-mono); font-size: 15px;
  letter-spacing: 0.32em; color: var(--c-tu);
  text-transform: uppercase;
  display: flex; align-items: center; gap: 10px;
}
.home-kicker::before {
  content: ""; width: 8px; height: 8px; border-radius: 50%;
  background: var(--c-tu); box-shadow: 0 0 10px var(--c-tu-glow);
}
.title-home {
  position: absolute; left: 140px; top: 220px;
}
.home-title {
  font-family: var(--f-display);
  font-size: 160px;
  line-height: 1.15;
  font-weight: 900;
  letter-spacing: -0.035em;
  padding-block: 0.1em;
  margin: 0;
  background: linear-gradient(135deg, #FFFFFF 0%, #E2EDF8 20%, #8E9FAA 45%, #FFFFFF 60%, #35E0FF 80%, #A855F7 100%);
  background-size: 200% auto;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: ql-titanium-sheen 7s infinite linear;
  filter: drop-shadow(0 0 25px rgba(53,224,255,0.4)) drop-shadow(0 0 60px rgba(168,85,247,0.25));
}
@keyframes ql-titanium-sheen {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
.home-sub {
  position: absolute; left: 140px; top: 485px;
  font-family: var(--f-mono); font-size: 17px; font-weight: 500;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: rgba(234,244,255,0.9); max-width: 860px; line-height: 1.6;
}
.home-start-btn {
  position: absolute; left: 140px; top: 575px;
  padding: 18px 44px; border-radius: 18px;
  font-size: 17px; font-weight: 700; letter-spacing: 0.05em;
  background: linear-gradient(135deg, rgba(53,224,255,0.25), rgba(168,85,247,0.25));
  border: 1px solid var(--c-tu);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.15), 0 0 30px rgba(53,224,255,0.35);
  color: var(--ice); cursor: pointer;
  transition: all 250ms var(--ease);
}
.home-start-btn:hover {
  transform: translateY(-2px);
  background: linear-gradient(135deg, rgba(53,224,255,0.42), rgba(168,85,247,0.42));
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.3), 0 0 45px var(--c-tu-glow);
}

/* ==========================================================================
   SCENE 2: TILTED 3D ORBIT MAP
   ========================================================================== */
.orbit-container {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: auto;
  touch-action: none;
}
.orbit-svg-layer {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none;
}

/* Central Sun Core */
.center-sun-core, .sun-core {
  position: absolute;
  width: 540px; height: 380px;
  left: calc(50% - 270px); top: calc(50% - 190px);
  z-index: 50;
  display: flex; flex-direction: column;
  overflow: hidden;
  box-shadow: inset 0 0 50px rgba(53,224,255,0.12), 0 0 80px rgba(47,107,255,0.25), 0 20px 60px rgba(0,0,0,0.6);
  border: 1px solid rgba(53,224,255,0.38);
}
.core-header {
  padding: 18px 24px 12px;
  border-bottom: 1px solid rgba(53,224,255,0.18);
  background: linear-gradient(180deg, rgba(53,224,255,0.08), transparent);
}
.core-badge {
  font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.2em;
  color: var(--c-tu); text-transform: uppercase; margin-bottom: 4px;
}
.core-title {
  font-family: var(--f-display); font-size: 19px; font-weight: 700; color: var(--ice);
}
.core-tabs, .core-formula-tabs {
  display: flex; gap: 8px; padding: 10px 20px;
  border-bottom: 1px solid rgba(53,224,255,0.12);
  background: rgba(4,9,24,0.4);
}
.core-tab {
  background: rgba(53,224,255,0.06); border: 1px solid rgba(53,224,255,0.2);
  color: rgba(234,244,255,0.75); padding: 5px 12px; border-radius: 10px;
  font-size: 12px; cursor: pointer; transition: all 200ms var(--ease);
}
.core-tab:hover { background: rgba(53,224,255,0.15); color: var(--ice); border-color: var(--c-tu); }
.core-tab.on, .core-tab.active { background: rgba(53,224,255,0.25); color: var(--c-tu); border-color: var(--c-tu); font-weight: 600; }
.core-body, .core-formula-list {
  flex: 1; overflow-y: auto; padding: 14px 20px;
}

/* Planet Cards on 3D Orbit */
.orbit-cards-layer {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none;
}
.orbit-card, .revolving-planet {
  position: absolute;
  width: 290px; height: 160px;
  margin-left: -145px; margin-top: -80px;
  cursor: pointer;
  pointer-events: auto;
  user-select: none;
  -webkit-user-select: none;
  transform-origin: center center;
  transition: transform 300ms var(--ease), box-shadow 300ms var(--ease);
  will-change: transform, opacity;
  padding: 16px 20px;
  display: flex; flex-direction: column; justify-content: space-between;
}
.orbit-card:hover, .revolving-planet:hover {
  transform: scale(1.18) !important;
  box-shadow: 0 0 35px var(--accent-glow) !important;
  border-color: var(--accent) !important;
}

.oc-top { display: flex; align-items: center; justify-content: space-between; }
.oc-node-id { font-family: var(--f-mono); font-size: 11px; color: var(--accent); letter-spacing: 0.1em; }
.oc-prog-ring { width: 34px; height: 34px; }
.oc-title { font-family: var(--f-display); font-size: 18px; font-weight: 700; color: var(--ice); margin: 6px 0; }
.oc-short { font-size: 12px; color: var(--muted); line-height: 1.35; max-height: 34px; overflow: hidden; }

/* 3-Tier Badges */
.oc-badges-row {
  display: flex; gap: 6px; margin-top: 8px;
}
.tier-badge {
  font-family: var(--f-mono); font-size: 10px; padding: 2px 7px;
  border-radius: 6px; background: rgba(255,255,255,0.06);
  color: rgba(234,244,255,0.4); border: 1px solid rgba(255,255,255,0.1);
  transition: all 250ms var(--ease);
}
.tier-badge.unlocked {
  background: rgba(53,224,255,0.15); color: var(--accent);
  border-color: var(--accent); box-shadow: 0 0 8px var(--accent-glow);
}

/* HUD Overlay Around Sun */
.sun-hud-canvas {
  position: absolute; top: calc(50% - 320px); left: calc(50% - 320px);
  width: 640px; height: 640px;
  pointer-events: none; z-index: 30;
}

/* ==========================================================================
   SCENE 5: VERTICAL SCROLL STORY (SINGLE SCROLL CONTAINER)
   ========================================================================== */
.ql-detail-story {
  position: absolute;
  left: 60px; right: 60px; top: 76px; bottom: 64px;
  overflow: hidden;
  padding: 0;
  overscroll-behavior: contain;
}

.ql-detail-grid {
  display: grid;
  gap: 24px;
  align-items: stretch;
  width: 100%;
  height: 100%;
  transition: grid-template-columns 450ms cubic-bezier(0.16, 1, 0.3, 1);
}
.ql-detail-grid.has-sim {
  grid-template-columns: 45fr 55fr;
}
.ql-detail-grid.has-sim.focus-active {
  grid-template-columns: 100fr 0fr;
  gap: 0;
}
.ql-detail-grid.no-sim {
  grid-template-columns: 1fr;
  max-width: 1240px;
  margin: 0 auto;
  overflow-y: auto;
  height: 100%;
}

/* LEFT CHAMBER: Fixed Non-Scrolling Glass Cockpit */
.ql-sim-left-col {
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-width: 0;
  height: 100%;
  overflow: hidden;
  position: relative;
}
.ql-sim-left-panel {
  display: flex;
  flex-direction: column;
  gap: 10px;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

/* RIGHT CHAMBER: Independent Scroll Container with 3D Drum-Roll */
.ql-content-right-col {
  display: flex;
  flex-direction: column;
  gap: 24px;
  min-width: 0;
  height: 100%;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 10px 24px 60px 10px;
  scroll-behavior: smooth;
  perspective: 1200px;
  transform-style: preserve-3d;
  transition: opacity 300ms ease;
}
.ql-detail-grid.focus-active .ql-content-right-col {
  opacity: 0;
  pointer-events: none;
  padding: 0;
}
.ql-sim-right-panel {
  display: flex;
  flex-direction: column;
  gap: 20px;
  width: 100%;
}

/* 3D Cylindrical Drum-Roll elements */
.theory-card, .formula-chip-row, .example-card, .sim-readouts-box, .sim-challenge-box, .ql-theory-grid, .formula-chips-wrap {
  transform-style: preserve-3d;
  backface-visibility: hidden;
  will-change: transform, opacity;
  transition: transform 100ms ease-out, opacity 100ms ease-out;
}

.ql-story-content {
  max-width: 1460px; margin: 0 auto;
}

/* Hero Header */
.ql-hero {
  margin-bottom: 36px;
  padding-bottom: 24px;
  border-bottom: 1px solid rgba(53,224,255,0.15);
}
.ql-hero-kicker {
  font-family: var(--f-mono); font-size: 12px; letter-spacing: 0.2em;
  color: var(--accent); text-transform: uppercase; margin-bottom: 8px;
}
.ql-hero-lead {
  font-size: 17px; color: var(--muted); line-height: 1.6; max-width: 980px;
}

/* Section Headings in Story */
.story-sec-title {
  display: flex; align-items: center; gap: 12px;
  font-family: var(--f-mono); font-size: 13px; letter-spacing: 0.15em;
  color: var(--accent); text-transform: uppercase;
  margin: 40px 0 18px 0;
}
.story-sec-title::after {
  content: ""; flex: 1; height: 1px;
  background: linear-gradient(90deg, var(--border-subtle), transparent);
}

/* Lý thuyết: Glass Cards */
.ql-theory-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
  gap: 20px; margin-bottom: 24px;
}
.theory-card {
  padding: 22px 26px; border-radius: 16px;
  background: rgba(6,14,36,0.65); border: 1px solid rgba(53,224,255,0.18);
  transition: all 250ms var(--ease);
}
.theory-card:hover {
  background: rgba(9,20,50,0.85); border-color: var(--accent);
  box-shadow: 0 10px 30px rgba(0,0,0,0.4), 0 0 15px var(--accent-glow);
}
.tc-title { font-size: 16px; font-weight: 700; color: var(--ice); margin-bottom: 10px; }
.tc-body { font-size: 14.5px; color: rgba(234,244,255,0.8); line-height: 1.65; }

/* Điểm cốt lõi Key Points */
.key-points-list {
  list-style: none; display: flex; flex-direction: column; gap: 10px; margin-top: 14px;
}
.key-points-list li {
  display: flex; align-items: flex-start; gap: 10px;
  font-size: 14px; color: var(--ice); line-height: 1.5;
}
.kp-bullet {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 8px var(--accent);
  margin-top: 7px; flex-shrink: 0;
}

/* Công thức Chip Rows */
.formula-chips-wrap {
  display: flex; flex-direction: column; gap: 14px; margin-bottom: 30px;
}
.formula-chip-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 24px; border-radius: 16px;
  background: rgba(6,14,36,0.7); border: 1px solid rgba(53,224,255,0.18);
  border-left: 4px solid var(--accent);
  transition: all 250ms var(--ease);
}
.formula-chip-row:hover {
  transform: translateX(4px);
  background: rgba(10,24,60,0.9); border-color: var(--accent);
  box-shadow: 0 8px 25px rgba(0,0,0,0.4), 0 0 18px var(--accent-glow);
}
.fc-left { display: flex; flex-direction: column; gap: 4px; }
.fc-name { font-size: 15px; font-weight: 700; color: var(--ice); }
.fc-legend { font-size: 12.5px; color: var(--muted); }
.fc-right {
  font-family: var(--f-mono); font-size: 20px; font-weight: 600;
  color: var(--accent); text-shadow: 0 0 12px var(--accent-glow);
}

/* Math HTML Fractions */
.frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; margin: 0 4px; }
.frac .num { border-bottom: 1.5px solid var(--accent); padding-bottom: 2px; }
.frac .den { padding-top: 2px; }

/* 3D Simulation Container in Story */
.sim-story-block {
  margin: 30px 0 40px 0;
}

/* Ví dụ áp dụng: Step-by-Step Reveal */
.example-card {
  padding: 26px 30px; border-radius: 18px;
  background: rgba(6,14,36,0.75); border: 1px solid rgba(53,224,255,0.22);
  margin-bottom: 36px;
}
.ex-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.ex-badge {
  font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.15em;
  color: var(--accent); background: rgba(53,224,255,0.1); padding: 4px 10px; border-radius: 6px;
}
.ex-challenge-link {
  font-family: var(--f-mono); font-size: 12px; color: var(--accent); cursor: pointer; text-decoration: underline;
}
.ex-prompt { font-size: 16px; font-weight: 600; color: var(--ice); line-height: 1.5; margin-bottom: 18px; }
.ex-steps-list { list-style: none; display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
.ex-step-item {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 10px 14px; border-radius: 10px;
  background: rgba(255,255,255,0.03); border-left: 3px solid var(--accent);
  font-size: 14.5px; color: var(--ice); line-height: 1.5;
  transition: opacity 250ms, transform 250ms;
}
.ex-step-item.hidden { display: none; }
.ex-step-n { font-family: var(--f-mono); font-weight: 700; color: var(--accent); }
.ex-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; }
.ex-ans-box { font-size: 15px; font-weight: 700; color: #69F0AE; display: none; }

/* Navigation Footer (Prev / Next) */
.story-footer-nav {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 50px; padding-top: 24px; border-top: 1px solid rgba(53,224,255,0.2);
}
.btn-nav-step {
  padding: 12px 28px; border-radius: 14px;
  background: rgba(7,16,40,0.7); border: 1px solid rgba(53,224,255,0.25);
  color: var(--ice); font-size: 14px; font-weight: 600; cursor: pointer;
  display: flex; align-items: center; gap: 10px; transition: all 200ms var(--ease);
}
.btn-nav-step:hover {
  background: rgba(53,224,255,0.2); border-color: var(--accent);
  box-shadow: 0 0 16px var(--accent-glow);
}

/* Vertical Section Spy Dots on Right Edge */
.ql-spy-dots {
  position: absolute; right: 28px; top: 50%; transform: translateY(-50%);
  display: flex; flex-direction: column; gap: 14px; z-index: 60;
}
.spy-dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: rgba(234,244,255,0.25); border: 1px solid rgba(53,224,255,0.3);
  cursor: pointer; transition: all 250ms var(--ease);
}
.spy-dot.active {
  background: var(--accent); box-shadow: 0 0 12px var(--accent);
  transform: scale(1.3);
}

/* ==========================================================================
   SIMULATION SHELL (LAYOUT & CONTROLS)
   ========================================================================== */
.ql-sim-shell {
  display: grid; grid-template-columns: 820px 1fr;
  gap: 24px; width: 100%;
}
.sim-viewport-col {
  display: flex; flex-direction: column; gap: 16px;
}
.sim-3d-wrap {
  position: relative; width: 100%; height: 480px;
  border-radius: 20px; overflow: hidden;
  background: rgba(4,9,24,0.85); border: 1px solid rgba(53,224,255,0.3);
}
.sim-3d-mount { width: 100%; height: 100%; cursor: grab; }
.sim-3d-mount.grabbing { cursor: grabbing; }
.g3d-canvas { width: 100%; height: 100%; display: block; }

.sim-brackets div {
  position: absolute; width: 12px; height: 12px;
  border-color: rgba(53,224,255,0.5); pointer-events: none;
}
.b-tl { top: 10px; left: 10px; border-top: 2px solid; border-left: 2px solid; }
.b-tr { top: 10px; right: 10px; border-top: 2px solid; border-right: 2px solid; }
.b-bl { bottom: 10px; left: 10px; border-bottom: 2px solid; border-left: 2px solid; }
.b-br { bottom: 10px; right: 10px; border-bottom: 2px solid; border-right: 2px solid; }

.sim-view-hint {
  position: absolute; bottom: 12px; left: 16px;
  font-family: var(--f-mono); font-size: 11px; color: rgba(234,244,255,0.45);
  pointer-events: none;
}
.sim-view-tools {
  position: absolute; top: 12px; right: 14px;
  display: flex; gap: 6px; z-index: 10;
}
.btn-tool {
  width: 30px; height: 30px; border-radius: 8px;
  background: rgba(7,16,40,0.7); border: 1px solid rgba(53,224,255,0.25);
  color: var(--ice); font-size: 12px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 150ms;
}
.btn-tool:hover { background: rgba(53,224,255,0.25); border-color: var(--accent); }

.sim-plot-card {
  height: 220px; padding: 14px 18px;
  display: flex; flex-direction: column;
}
.sim-plot-head {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;
}
.plot-tag { font-family: var(--f-mono); font-size: 10.5px; color: var(--accent); letter-spacing: 0.1em; }
.plot-sub { font-size: 12px; color: var(--muted); }
.sim-plot-canvas { width: 100%; flex: 1; border-radius: 10px; }

/* Controls & Readouts Sidebar */
.sim-sidebar-col {
  display: flex; flex-direction: column; gap: 14px;
}
.sidebar-label {
  font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.15em;
  color: var(--accent); text-transform: uppercase; margin-bottom: 8px;
}
.sim-presets-box, .sim-controls-box, .sim-readouts-box, .sim-challenge-box {
  padding: 16px 20px;
}
.sim-preset-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.preset-chip {
  padding: 6px 14px; border-radius: 10px;
  background: rgba(53,224,255,0.06); border: 1px solid rgba(53,224,255,0.22);
  color: var(--ice); font-size: 12px; cursor: pointer; transition: all 180ms;
}
.preset-chip:hover {
  background: rgba(53,224,255,0.2); border-color: var(--accent);
  box-shadow: 0 0 10px var(--accent-glow);
}

.sim-controls-list { display: flex; flex-direction: column; gap: 12px; }
.ctrl-group { display: flex; flex-direction: column; gap: 4px; }
.ctrl-top { display: flex; justify-content: space-between; font-size: 13px; }
.ctrl-label { color: rgba(234,244,255,0.85); font-weight: 500; }
.ctrl-num { font-family: var(--f-mono); font-size: 12.5px; color: var(--accent); }

.sim-slider {
  -webkit-appearance: none; appearance: none; width: 100%; height: 6px;
  border-radius: 3px; background: rgba(255,255,255,0.12); outline: none;
}
.sim-slider::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 18px; height: 18px;
  border-radius: 50%; background: #FFFFFF; border: 2px solid var(--accent);
  cursor: pointer; box-shadow: 0 0 10px var(--accent-glow);
}

.sim-readouts-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px;
}
.readout-item {
  display: flex; justify-content: space-between; font-family: var(--f-mono);
  font-size: 13px; padding: 6px 10px; border-radius: 8px;
  background: rgba(4,9,24,0.5); border: 1px solid rgba(53,224,255,0.1);
}
.r-label { color: rgba(234,244,255,0.65); }
.r-val { color: var(--ice); font-weight: 600; }
.r-val.flash { color: var(--accent); text-shadow: 0 0 10px var(--accent); }

/* Challenge Panel */
.challenge-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.ch-badge { font-family: var(--f-mono); font-size: 11px; color: #FFB300; font-weight: 700; }
.ch-state { font-family: var(--f-mono); font-size: 10px; color: var(--muted); }
.ch-q { font-size: 13.5px; line-height: 1.45; color: var(--ice); margin-bottom: 10px; }
.ch-choices { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.ch-choice-label {
  display: flex; align-items: flex-start; gap: 8px; font-size: 12.5px;
  cursor: pointer; color: rgba(234,244,255,0.85); line-height: 1.35;
}
.ch-confirm-btn {
  width: 100%; padding: 8px; border-radius: 10px;
  background: linear-gradient(90deg, rgba(53,224,255,0.2), rgba(168,85,247,0.2));
  border: 1px solid var(--accent); color: var(--ice);
  font-size: 12px; font-weight: 700; cursor: pointer;
}
.ch-result-box {
  margin-top: 10px; padding: 10px; border-radius: 10px;
  font-size: 12px; line-height: 1.4;
}
.ch-result-box.ok { background: rgba(0,245,160,0.12); border: 1px solid #00F5A0; }
.ch-result-box.fail { background: rgba(255,59,48,0.12); border: 1px solid #FF3B30; }
.res-badge { font-weight: 700; margin-bottom: 4px; font-family: var(--f-mono); font-size: 11px; }
.res-badge.ok { color: #00F5A0; }
.res-badge.fail { color: #FF3B30; }

/* Settings Popover */
#settingsPopover {
  position: absolute; top: 80px; right: 60px;
  width: 320px; padding: 22px; z-index: 100;
  display: none; flex-direction: column; gap: 16px;
}
#settingsPopover.open { display: flex; }
.setting-row { display: flex; align-items: center; justify-content: space-between; font-size: 13.5px; }

/* Portrait Hint Overlay */
#portraitHint {
  position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
  background: rgba(3,7,20,0.92); z-index: 9999;
  display: none; align-items: center; justify-content: center;
  text-align: center; padding: 24px;
}
.ph-box {
  max-width: 420px; padding: 30px; border-radius: 20px;
  border: 1px solid var(--c-tu); background: rgba(7,16,40,0.95);
}
.ph-text { font-size: 16px; line-height: 1.5; color: var(--ice); margin: 16px 0; }

/* ==========================================================================
   PILLAR 3 & 6: QUANTUM FRAMES, ENERGY CONDUIT BEAM & SCI-FI RETICLE
   ========================================================================== */
.ql-frame-quantum {
  border: 1px solid rgba(53,224,255,0.3);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12), 0 20px 50px rgba(0,0,0,0.65), 0 0 25px var(--accent-glow);
  backdrop-filter: blur(30px) saturate(160%);
  -webkit-backdrop-filter: blur(30px) saturate(160%);
  border-radius: 20px;
  position: relative;
}

.hud-coord-label {
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: 0.15em;
  color: var(--accent);
  text-shadow: 0 0 8px var(--accent-glow);
}

/* Energy Conduit Beam Canvas */
#beamCanvas {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 80;
}

/* Sci-Fi Reticle Cursor */
@media (pointer: fine) {
  .ql-cursor-reticle {
    position: fixed;
    top: 0; left: 0;
    width: 36px; height: 36px;
    margin-left: -18px; margin-top: -18px;
    pointer-events: none;
    z-index: 9999;
    opacity: 0;
    transition: transform 70ms linear, opacity 180ms ease;
  }
  .ql-cursor-reticle.active { opacity: 0.95; }
  .ql-cursor-reticle.hovering {
    transform: scale(1.6);
  }
  .reticle-core {
    position: absolute; top: 16px; left: 16px; width: 4px; height: 4px;
    background: #FFFFFF; border-radius: 50%; box-shadow: 0 0 8px var(--accent);
  }
  .reticle-ring {
    position: absolute; top: 6px; left: 6px; width: 24px; height: 24px;
    border: 1px dashed var(--accent); border-radius: 50%;
    animation: ql-reticle-spin 12s linear infinite;
  }
  .reticle-brackets span {
    position: absolute; width: 6px; height: 6px;
    border-color: var(--accent); border-style: solid;
  }
  .rb-tl { top: 2px; left: 2px; border-width: 1.5px 0 0 1.5px; }
  .rb-tr { top: 2px; right: 2px; border-width: 1.5px 1.5px 0 0; }
  .rb-bl { bottom: 2px; left: 2px; border-width: 0 0 1.5px 1.5px; }
  .rb-br { bottom: 2px; right: 2px; border-width: 0 1.5px 1.5px 0; }
  @keyframes ql-reticle-spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
}

</style>
</head>
<body>

<div id="app">
  <!-- Persistent Parallax Background World -->

<script>

   (a) opened
   (b) interacted with simulation
   (c) challenge answered correctly
   ========================================================================== */
const ProgressEngine = (function() {
  const STORAGE_KEY = 'vatli12_progress_v2';
  const SIM_SECTIONS = [
    'sec-1.1.1', 'sec-2.1.1', 'sec-2.1.2',
    'sec-3.1.1', 'sec-3.1.2', 'sec-3.1.3', 'sec-3.2.1',
    'sec-4.1.1', 'sec-4.2.1'
  ];

  const TOPIC_SECTIONS = {
    'topic-01': ['sec-1.1.1'],
    'topic-02': ['sec-2.1.1', 'sec-2.1.2'],
    'topic-03': ['sec-3.1.1', 'sec-3.1.2', 'sec-3.1.3', 'sec-3.2.1'],
    'topic-04': ['sec-4.1.1', 'sec-4.2.1']
  };

  let progressData = {};
  SIM_SECTIONS.forEach(id => {
    progressData[id] = { opened: false, interacted: false, challenge: false };
  });

  // Load from localStorage
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      SIM_SECTIONS.forEach(id => {
        if (parsed[id]) {
          progressData[id] = {
            opened: !!parsed[id].opened,
            interacted: !!parsed[id].interacted,
            challenge: !!parsed[id].challenge
          };
        }
      });
    }
  } catch (e) {}

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(progressData));
    } catch (e) {}
    notifyChange();
  }

  const listeners = [];
  function onChange(fn) {
    listeners.push(fn);
  }
  function notifyChange() {
    listeners.forEach(fn => {
      try { fn(getSummary()); } catch (e) {}
    });
  }

  function markOpened(secId) {
    if (progressData[secId] && !progressData[secId].opened) {
      progressData[secId].opened = true;
      save();
    }
  }

  function markInteracted(secId) {
    if (progressData[secId] && !progressData[secId].interacted) {
      progressData[secId].interacted = true;
      save();
    }
  }

  function markChallengePassed(secId) {
    if (progressData[secId] && !progressData[secId].challenge) {
      progressData[secId].challenge = true;
      save();
      if (window.AudioEngine) {
        AudioEngine.playCorrect();
      }
      checkTierUnlocks();
    }
  }

  function checkTierUnlocks() {
    // Check if any topic newly achieved Bac Thay or all topics achieved Overall Mastery
    let allMaster = true;
    for (const [topicId, secs] of Object.entries(TOPIC_SECTIONS)) {
      const allPassed = secs.every(s => progressData[s].challenge);
      if (!allPassed) allMaster = false;
    }
    if (allMaster && window.AudioEngine) {
      setTimeout(() => AudioEngine.playFanfare(), 300);
    }
  }

  function getTopicProgress(topicId) {
    const secs = TOPIC_SECTIONS[topicId] || [];
    if (!secs.length) return { pct: 0, khamPha: false, thucNghiem: false, bacThay: false };

    let totalPoints = secs.length * 3;
    let earned = 0;
    let allOpened = true;
    let allInteracted = true;
    let allChallenge = true;

    secs.forEach(id => {
      const s = progressData[id] || {};
      if (s.opened) earned++; else allOpened = false;
      if (s.interacted) earned++; else allInteracted = false;
      if (s.challenge) earned++; else allChallenge = false;
    });

    const pct = Math.round((earned / totalPoints) * 100);
    return {
      pct,
      percent: pct,
      khamPha: allOpened,
      thucNghiem: allInteracted,
      bacThay: allChallenge
    };
  }

  function getTopicBadges(topicId) {
    const p = getTopicProgress(topicId);
    return {
      khamPha: p.khamPha,
      thucNghiem: p.thucNghiem,
      bacThay: p.bacThay
    };
  }

  function getGlobalProgress() {
    let total = SIM_SECTIONS.length * 3;
    let earned = 0;
    SIM_SECTIONS.forEach(id => {
      const s = progressData[id] || {};
      if (s.opened) earned++;
      if (s.interacted) earned++;
      if (s.challenge) earned++;
    });
    const pct = Math.round((earned / total) * 100);
    const isMaster = SIM_SECTIONS.every(id => progressData[id].challenge);
    return { pct, percent: pct, earned, total, isMaster };
  }

  function getSummary() {
    const topics = {};
    for (const tid of Object.keys(TOPIC_SECTIONS)) {
      topics[tid] = getTopicProgress(tid);
    }
    const global = getGlobalProgress();
    return { topics, global, raw: progressData };
  }

  function resetProgress() {
    SIM_SECTIONS.forEach(id => {
      progressData[id] = { opened: false, interacted: false, challenge: false };
    });
    save();
  }

  return {
    markOpened,
    markSectionOpened: markOpened,
    markInteracted,
    markChallengePassed,
    getTopicProgress,
    getTopicBadges,
    getGlobalProgress,
    getSummary,
    resetProgress,
    onChange
  };
})();
